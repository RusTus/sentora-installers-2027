# Sentora Elk node: a FortiGate's logs (sentora-elk-node fortigate ADDRESS).
#
# The FortiGate sends its syslog over TLS to port 6516, where the node's rsyslog takes it (only that address, and only
# with the certificate the node made for it) and hands each line to this pipeline on 127.0.0.1:5516 as JSON
# {"message": "<FortiOS line>", "from": "<address>"}. FortiOS lines are key=value pairs; every pair is kept under
# fgt.* (one "flattened" field: searchable, no mapping per key) and the ones the dashboards use are copied to Elastic
# Common Schema fields: who (user.name, source.ip), where to (url.domain, destination.*), what happened
# (event.action, event.outcome), how much (network.bytes), web category, app, VPN, threats.
#
# Written by the Sentora Elk node installer; changes made here are replaced by its next --update.

input {
  tcp {
    id => "fortigate_in"
    host => "127.0.0.1"
    port => 5516
    codec => json_lines { target => "[@metadata][in]" decode_size_limit_bytes => 65536 }
  }
}

filter {
  ruby {
    id => "fortigate_envelope"
    code => '
      i = event.get("[@metadata][in]")
      i = {} unless i.is_a?(Hash)
      m = i["message"].is_a?(String) ? i["message"][0, 32768] : ""
      # (the syslog header, if rsyslog left one, is everything before the first key=value)
      m = m.sub(/\A.*?(?=\b(?:date|logver|timestamp|devname|eventtime)=)/m, "")
      event.set("message", m)
      f = i["from"].is_a?(String) ? i["from"][0, 64] : ""
      event.set("[observer][ip]", f) unless f.empty?
      event.set("[observer][vendor]", "Fortinet")
      event.set("[observer][product]", "FortiGate")
      event.set("[event][module]", "fortigate")
    '
  }
  kv {
    id => "fortigate_kv"
    source => "message"
    target => "fgt"
    field_split => " "
    value_split => "="
    trim_value => "\""
    include_brackets => false
    allow_duplicate_values => false
  }
  if ![fgt][type] {
    mutate { add_tag => ["fortigate_unparsed"] }
  } else {
    if [fgt][date] and [fgt][time] {
      mutate { add_field => { "[@metadata][ts]" => "%{[fgt][date]} %{[fgt][time]}" } }
      if [fgt][tz] {
        mutate { replace => { "[@metadata][ts]" => "%{[fgt][date]} %{[fgt][time]} %{[fgt][tz]}" } }
        date { match => ["[@metadata][ts]", "yyyy-MM-dd HH:mm:ss Z"] tag_on_failure => [] }
      } else {
        date { match => ["[@metadata][ts]", "yyyy-MM-dd HH:mm:ss"] tag_on_failure => [] }
      }
    }
    # the hour and the day of the week at the FortiGate (its own time zone), for when the internet is busiest
    if [fgt][date] and [fgt][time] {
      ruby {
        id => "fortigate_when"
        code => '
          begin
            d, t, z = event.get("[fgt][date]").to_s, event.get("[fgt][time]").to_s, event.get("[fgt][tz]").to_s
            if d =~ /\A\d{4}-\d\d-\d\d\z/ && t =~ /\A(\d\d):\d\d:\d\d\z/
              h = $1.to_i
              wd = Time.utc(*d.split("-").map(&:to_i)).wday
              event.set("[fortigate][hour]", format("%02d", h))
              event.set("[fortigate][hour_n]", h)
              event.set("[fortigate][weekday]", ["7 Sun", "1 Mon", "2 Tue", "3 Wed", "4 Thu", "5 Fri", "6 Sat"][wd])
            end
          rescue StandardError
          end
        '
      }
    }
    ruby {
      id => "fortigate_ecs"
      code => '
        g = event.get("fgt") || {}
        s = lambda { |k| v = g[k]; v.is_a?(String) && !v.empty? && v != "N/A" ? v : nil }
        n = lambda { |k| v = g[k]; v.to_s =~ /\A\d+\z/ ? v.to_i : nil }
        ip = lambda { |v| v && v =~ /\A[0-9a-fA-F:.]+\z/ ? v : nil }
        type, sub = s.call("type"), s.call("subtype")
        event.set("[fortigate][type]", type) if type
        event.set("[fortigate][subtype]", sub) if sub
        event.set("[event][dataset]", "fortigate." + [type, sub].compact.join("."))
        event.set("[observer][name]", s.call("devname")) if s.call("devname")
        event.set("[log][level]", s.call("level")) if s.call("level")
        event.set("[message]", s.call("msg")) if s.call("msg")
        # who
        # who: the name of a person (an IPsec tunnel to another site has none: FortiOS puts the address of the other end in "user")
        isip = lambda { |v| v && v =~ /\A[0-9a-fA-F:.]+\z/ && v.count(".:") >= 2 }
        uu = s.call("user")
        u = (uu unless isip.call(uu)) || s.call("xauthuser") || s.call("unauthuser")
        event.set("[user][name]", u[0, 128]) if u
        event.set("[group][name]", s.call("group")) if s.call("group")
        event.set("[source][ip]", ip.call(s.call("srcip"))) if ip.call(s.call("srcip"))
        event.set("[source][port]", n.call("srcport")) if n.call("srcport")
        event.set("[source][mac]", s.call("srcmac")) if s.call("srcmac")
        event.set("[host][name]", s.call("srcname")) if s.call("srcname")
        event.set("[host][os][name]", s.call("osname")) if s.call("osname")
        event.set("[observer][ingress][interface][name]", s.call("srcintf")) if s.call("srcintf")
        event.set("[observer][egress][interface][name]", s.call("dstintf")) if s.call("dstintf")
        # where to
        event.set("[destination][ip]", ip.call(s.call("dstip"))) if ip.call(s.call("dstip"))
        event.set("[destination][port]", n.call("dstport")) if n.call("dstport")
        h = s.call("hostname")
        event.set("[url][domain]", h.downcase[0, 255]) if h
        event.set("[url][path]", s.call("url")[0, 1024]) if s.call("url")
        event.set("[network][application]", s.call("app")) if s.call("app")
        event.set("[fortigate][appcat]", s.call("appcat")) if s.call("appcat")
        event.set("[fortigate][category]", s.call("catdesc")) if s.call("catdesc")
        event.set("[fortigate][service]", s.call("service")) if s.call("service")
        event.set("[rule][name]", s.call("policyname") || s.call("policyid")) if s.call("policyname") || s.call("policyid")
        # how much
        sb, rb = n.call("sentbyte"), n.call("rcvdbyte")
        event.set("[source][bytes]", sb) if sb
        event.set("[destination][bytes]", rb) if rb
        event.set("[network][bytes]", (sb || 0) + (rb || 0)) if sb || rb
        event.set("[event][duration]", n.call("duration") * 1_000_000_000) if n.call("duration")
        # what happened
        a = s.call("action") || s.call("utmaction") || s.call("status")
        event.set("[event][action]", a) if a
        bad = %w[deny blocked block dropped drop reset ssl-login-fail login-failed failed failure negotiate-error].include?(a.to_s)
        event.set("[event][outcome]", bad ? "failure" : "success") if a
        # VPN: the user, where they connect from (remip: their own address), the kind of tunnel
        if sub == "vpn"
          event.set("[event][category]", "vpn")
          r = ip.call(s.call("remip"))
          event.set("[source][ip]", r) if r
          event.set("[fortigate][vpn][tunnel]", s.call("tunneltype")) if s.call("tunneltype")
          event.set("[fortigate][vpn][assigned_ip]", s.call("tunnelip")) if s.call("tunnelip")
          event.set("[fortigate][vpn][name]", s.call("vpntunnel")[0, 128]) if s.call("vpntunnel")
          # a tunnel to another site (no person on it) or a person (FortiClient, SSL VPN)
          site = s.call("tunneltype").to_s.start_with?("ipsec") && !s.call("xauthuser") && (!uu || isip.call(uu))
          event.set("[fortigate][vpn][kind]", site ? "site-to-site" : "user")
          # up (1) or down (0), for the tunnel tiles: tunnel-stats comes every few minutes while a tunnel is up
          event.set("[fortigate][vpn][up]", 1) if %w[tunnel-up tunnel-stats].include?(a.to_s)
          event.set("[fortigate][vpn][up]", 0) if a.to_s == "tunnel-down"
          d = (s.call("logdesc") || "").downcase
          event.set("[event][outcome]", "failure") if d.include?("fail")
        end
        # admin and user logins on the FortiGate itself
        if sub == "system" && (s.call("logdesc") || "").downcase.include?("admin login")
          event.set("[event][category]", "admin-login")
          event.set("[event][outcome]", (s.call("logdesc") || "").downcase.include?("fail") ? "failure" : "success")
        end
        # threats
        event.set("[fortigate][threat]", s.call("attack") || s.call("virus") || s.call("botnetdomain") || s.call("threat")) if s.call("attack") || s.call("virus") || s.call("botnetdomain") || s.call("threat")
        event.set("[event][severity_name]", s.call("severity") || s.call("crlevel")) if s.call("severity") || s.call("crlevel")
        event.set("[fortigate][description]", s.call("logdesc")) if s.call("logdesc")
      '
    }
  }
  # where outside addresses are (Elastic's free GeoLite2 database)
  if [source][ip] and [source][ip] !~ /^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|[fF][cdCD]|[fF][eE]80)/ {
    geoip { source => "[source][ip]" target => "[source]" ecs_compatibility => "v8" tag_on_failure => [] }
  }
  if [destination][ip] and [destination][ip] !~ /^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|[fF][cdCD]|[fF][eE]80)/ {
    geoip { source => "[destination][ip]" target => "[destination]" ecs_compatibility => "v8" tag_on_failure => [] }
  }
}

output {
  elasticsearch {
    id => "fortigate_es"
    hosts => ["https://127.0.0.1:9200"]
    ssl_certificate_authorities => ["/etc/logstash/sentora/http_ca.crt"]
    user => "sentora_logstash"
    password => "${SENTORA_ES_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "fortigate"
    data_stream_namespace => "default"
  }
}
