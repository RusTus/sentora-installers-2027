# Sentora Elk node: Veeam Backup & Replication's events (sentora-elk-node veeam ADDRESS).
#
# Veeam (12.1 or newer, Options > Event Forwarding > Syslog) sends RFC 5424 syslog over TLS to port 6517, where the
# node's rsyslog takes it (only that address) and hands each line to this pipeline on 127.0.0.1:5517 as JSON
# {"message": "<syslog line>", "from": "<address>"}. The details are in its structured data, key="value": every
# pair is kept under veeam.* (one flattened field) and the ones the dashboard uses are copied: the job, its result
# (Success, Warning, Failed), the session, the event number, how long it took and how much it moved when Veeam says.
#
# Written by the Sentora Elk node installer; changes made here are replaced by its next --update.

input {
  tcp {
    id => "veeam_in"
    host => "127.0.0.1"
    port => 5517
    codec => json_lines { target => "[@metadata][in]" decode_size_limit_bytes => 65536 }
  }
}

filter {
  ruby {
    id => "veeam_parse"
    code => '
      i = event.get("[@metadata][in]")
      i = {} unless i.is_a?(Hash)
      m = i["message"].is_a?(String) ? i["message"][0, 32768] : ""
      f = i["from"].is_a?(String) ? i["from"][0, 64] : ""
      event.set("[observer][ip]", f) unless f.empty?
      event.set("[observer][vendor]", "Veeam")
      event.set("[observer][product]", "Backup & Replication")
      event.set("[event][module]", "veeam")
      # RFC 5424: <pri>1 time host app procid msgid [sd][sd] message
      if m =~ /\A<(\d{1,3})>1 (\S+) (\S+) (\S+) (\S+) (\S+) ((?:\[(?:[^\]\\]|\\.)*\])+|-) ?(.*)\z/m
        pri, ts, host, app, sd, msg = $1.to_i, $2, $3, $4, $7, $8
        event.set("[@metadata][ts]", ts)
        event.set("[observer][name]", host[0, 255]) unless host == "-"
        event.set("[log][syslog][severity][code]", pri % 8)
        event.set("[process][name]", app[0, 64]) unless app == "-"
        kv = {}
        sd.to_s.scan(/([A-Za-z][A-Za-z0-9_.-]{0,63})=(?:"((?:[^"\\]|\\.)*)"|([^\s\]]+))/) do |k, q, b|
          v = q ? q.gsub(/\\(.)/, "\\1") : b
          kv[k] = v[0, 2048] if kv.size < 100
        end
        event.set("veeam", kv) unless kv.empty?
        event.set("message", (msg.to_s.strip.empty? ? kv["Description"].to_s : msg.to_s.strip)[0, 4096])
        id = kv["instanceId"].to_s
        event.set("[event][code]", id) unless id.empty?
        job = kv["JobName"] || kv["jobName"] || kv["Name"]
        event.set("[veeam_job][name]", job[0, 255]) if job
        event.set("[veeam_job][session]", kv["JobSessionID"]) if kv["JobSessionID"]
        event.set("[veeam_job][type]", kv["JobType"]) if kv["JobType"]
        d = kv["Description"].to_s + " " + msg.to_s
        r = kv["Result"] || kv["result"] || kv["Status"] || (d =~ /finished with \[?(Success|Warning|Failed)\]?/i ? $1 : nil)
        if r
          r = r.capitalize
          event.set("[veeam_job][result]", r)
          event.set("[veeam_job][health]", { "Success" => 1.0, "Warning" => 0.5, "Failed" => 0.0 }[r]) if ["Success", "Warning", "Failed"].include?(r)
          event.set("[event][outcome]", r == "Failed" ? "failure" : "success")
          event.set("[event][action]", "job-finished")
        elsif d =~ /\bstarted\b/i && job
          event.set("[event][action]", "job-started")
        elsif d =~ /malware/i
          event.set("[event][action]", "malware-detected")
        elsif d =~ /logged on/i
          event.set("[event][action]", "console-login")
        end
        # (why, for a job that failed or warned: the words after the result, short, to group by)
        if r && r != "Success"
          w = kv["Description"].to_s.sub(/\A.*?finished with \[?\w+\]?\.?\s*/, "").sub(/\ADuration [\d:]+\.?\s*/, "")
          event.set("[veeam_job][why]", (w.empty? ? r : w)[0, 300])
        end
        if d =~ /Duration (\d+):(\d\d):(\d\d)/
          event.set("[veeam_job][duration_min]", ($1.to_i * 60 + $2.to_i + $3.to_i / 60.0).round(1))
        end
        if d =~ /transferred ([\d.]+) (KB|MB|GB|TB)/i
          mult = { "KB" => 1.0 / 1048576, "MB" => 1.0 / 1024, "GB" => 1.0, "TB" => 1024.0 }[$2.upcase]
          event.set("[veeam_job][transferred_gb]", ($1.to_f * mult).round(2))
        end
        event.set("[host][name]", kv["ObjectName"][0, 255]) if kv["ObjectName"]
        event.set("[user][name]", kv["UserName"][0, 128]) if kv["UserName"]
      else
        event.set("message", m)
        event.tag("veeam_unparsed")
      end
    '
  }
  date {
    match => ["[@metadata][ts]", "ISO8601"]
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    id => "veeam_es"
    hosts => ["https://127.0.0.1:9200"]
    ssl_certificate_authorities => ["/etc/logstash/sentora/http_ca.crt"]
    user => "sentora_logstash"
    password => "${SENTORA_ES_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "veeam"
    data_stream_namespace => "default"
  }
}
