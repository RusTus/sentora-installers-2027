# Sentora Elk node: Active Directory, the domain controllers' security events (sentora-elk-node windows ADDRESS).
#
# Each domain controller runs Winlogbeat (Elastic's agent for Windows event logs, set up by the script that command
# makes) and sends only the events that matter to port 6518: TLS both ways, its own certificate from this node's
# Windows authority (named sentora-dc-ADDRESS), from that address only (firewall, and checked again below).
# The events are mapped to Elastic Common Schema: who (user.name), from where (source.ip, windows.from_machine),
# what happened (event.action, event.outcome, windows.reason), which account or group was changed (windows.target,
# group.name, windows.member), and when in the office's own time (windows.hour_n, windows.off_hours).
#
# Written by the Sentora Elk node installer; changes made here are replaced by its next --update.

input {
  beats {
    id => "windows_in"
    host => "0.0.0.0"
    port => 6518
    ssl_enabled => true
    ssl_certificate => "/etc/logstash/sentora/windows/node.crt"
    ssl_key => "/etc/logstash/sentora/windows/node.key"
    ssl_certificate_authorities => ["/etc/logstash/sentora/windows/dc-ca.crt"]
    ssl_client_authentication => "required"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
    enrich => ["ssl_peer_metadata", "source_metadata"]
    ecs_compatibility => "v8"
  }
}

filter {
  # only a domain controller this node knows, sending from its own address with its own certificate
  ruby {
    id => "windows_gate"
    code => '
      allowed = [SENTORA_DC_LIST]
      sub = (event.get("[@metadata][input][beats][tls][client][subject]") || event.get("[@metadata][tls_peer][subject]")).to_s
      ip = (event.get("[@metadata][input][beats][host][ip]") || event.get("[@metadata][ip_address]")).to_s
      cn = sub[/CN=([^,\/]+)/, 1].to_s
      dc = cn.start_with?("sentora-dc-") ? cn.sub("sentora-dc-", "") : ""
      if dc.empty? || !allowed.include?(dc) || dc != ip
        event.cancel
      else
        event.set("[observer][ip]", ip)
      end
    '
  }
  ruby {
    id => "windows_ecs"
    code => '
      w = event.get("winlog")
      w = {} unless w.is_a?(Hash)
      d = w["event_data"].is_a?(Hash) ? w["event_data"] : {}
      u = w["user_data"].is_a?(Hash) ? w["user_data"] : {}
      s = lambda { |k| v = d[k] || u[k]; v = v.to_s; v.empty? || v == "-" ? nil : v[0, 512] }
      id = (w["event_id"] || event.get("[event][code]")).to_s
      event.set("[event][code]", id)
      event.set("[event][module]", "windows")
      event.set("[observer][vendor]", "Microsoft")
      event.set("[observer][product]", "Active Directory")
      dc = w["computer_name"].to_s.split(".").first.to_s.downcase
      event.set("[host][name]", dc) unless dc.empty?
      act = { "4624" => "logon", "4625" => "logon-failed", "4740" => "locked-out", "4767" => "unlocked",
              "4720" => "account-created", "4722" => "account-enabled", "4725" => "account-disabled", "4726" => "account-deleted",
              "4723" => "password-changed", "4724" => "password-reset", "4738" => "account-changed", "4781" => "account-renamed",
              "4728" => "group-member-added", "4732" => "group-member-added", "4756" => "group-member-added",
              "4729" => "group-member-removed", "4733" => "group-member-removed", "4757" => "group-member-removed",
              "4768" => "kerberos-logon", "4771" => "kerberos-failed", "4776" => "ntlm-check", "1102" => "log-cleared",
              "4719" => "audit-policy-changed", "5136" => "directory-changed" }[id] || "event-" + id
      out = "success"
      reason = nil
      status = (s.call("SubStatus") && s.call("SubStatus") != "0x0" ? s.call("SubStatus") : s.call("Status")).to_s.downcase
      why = { "0xc000006a" => "wrong password", "0xc0000064" => "no such user", "0xc0000234" => "account locked",
              "0xc0000072" => "account disabled", "0xc000006f" => "outside allowed hours", "0xc0000070" => "not allowed from that computer",
              "0xc0000071" => "password expired", "0xc0000193" => "account expired", "0xc0000133" => "clocks differ",
              "0xc0000224" => "must change password", "0xc000015b" => "logon type not allowed", "0xc000006d" => "wrong user name or password",
              "0xc0000413" => "authentication firewall" }
      kerb = { "0x6" => "no such user", "0x12" => "account disabled, locked or expired", "0x17" => "password expired",
               "0x18" => "wrong password", "0x25" => "clocks differ", "0x20" => "ticket expired" }
      case id
      when "4625"
        out = "failure"; reason = why[status] || "failed (" + status + ")"
      when "4771"
        out = "failure"; c = s.call("FailureCode").to_s.downcase; reason = kerb[c] || "failed (" + c + ")"
      when "4776"
        if status != "" && status != "0x0"
          out = "failure"; act = "ntlm-failed"; reason = why[status] || "failed (" + status + ")"
        end
      when "4768"
        c = s.call("Status").to_s.downcase
        if c != "" && c != "0x0"
          out = "failure"; act = "kerberos-failed"; reason = kerb[c] || "failed (" + c + ")"
        end
      when "4740"
        out = "failure"; reason = "too many wrong passwords"
      end
      event.set("[event][action]", act)
      event.set("[event][outcome]", out)
      event.set("[windows][reason]", reason) if reason
      logon = %w[4624 4625 4740 4767 4768 4771 4776].include?(id)
      event.set("[event][category]", logon ? ["authentication"] : ["iam"])
      if logon
        n = s.call("TargetUserName")
        event.set("[user][name]", n.downcase[0, 128]) if n
        event.set("[user][domain]", s.call("TargetDomainName").to_s.upcase[0, 128]) if s.call("TargetDomainName") && id != "4740"
        # (the computer it came from: a lockout names its caller computer in TargetDomainName)
        m = id == "4740" ? s.call("TargetDomainName") : (s.call("WorkstationName") || s.call("Workstation"))
        event.set("[windows][from_machine]", m.sub(/\A\\\\+/, "").upcase[0, 128]) if m
      else
        a = s.call("SubjectUserName")
        event.set("[user][name]", a.downcase[0, 128]) if a
        t = s.call("TargetUserName")
        event.set("[windows][target]", t[0, 256]) if t
        if act.start_with?("group-member")
          event.set("[group][name]", t[0, 256]) if t
          mem = s.call("MemberName").to_s
          mem = mem[/\ACN=((?:[^,\\]|\\.)+)/i, 1].to_s.gsub("\\", "") if mem.start_with?("CN=", "cn=")
          mem = s.call("MemberSid").to_s if mem.empty?
          event.set("[windows][member]", mem[0, 256]) unless mem.empty?
          admins = ["domain admins", "enterprise admins", "schema admins", "administrators", "account operators", "backup operators",
                    "server operators", "print operators", "group policy creator owners", "dnsadmins", "enterprise key admins", "key admins"]
          event.set("[windows][admin_group]", admins.include?(t.to_s.downcase))
        end
        if id == "5136"
          cls = s.call("ObjectClass").to_s
          event.set("[windows][object]", s.call("ObjectDN").to_s[0, 512]) if s.call("ObjectDN")
          event.set("[windows][object_class]", cls[0, 128]) unless cls.empty?
          event.set("[windows][attribute]", s.call("AttributeLDAPDisplayName").to_s[0, 128]) if s.call("AttributeLDAPDisplayName")
          event.set("[event][action]", "gpo-changed") if cls == "groupPolicyContainer"
        end
      end
      ip = s.call("IpAddress").to_s.sub(/\A::ffff:/, "")
      event.set("[source][ip]", ip) if ip =~ /\A[0-9a-fA-F:.]+\z/ && ip.count(".:") >= 2 && !["::1", "127.0.0.1"].include?(ip)
      fr = event.get("[windows][from_machine]") || event.get("[source][ip]")
      event.set("[windows][from]", fr) if fr
      lt = s.call("LogonType")
      if lt && lt =~ /\A\d+\z/
        event.set("[windows][logon_type]", lt.to_i)
        event.set("[windows][logon_kind]", { 2 => "at the keyboard", 3 => "network", 4 => "batch", 5 => "service", 7 => "unlock",
                                              8 => "network (plain text)", 9 => "new credentials", 10 => "remote desktop", 11 => "cached" }[lt.to_i] || "type " + lt)
      end
      # the office time (the domain controller sends its own offset, e.g. -05:00): hour, day, outside working hours
      begin
        tz = event.get("[event][timezone]").to_s
        if tz =~ /\A([+-])(\d\d):?(\d\d)\z/
          off = ($1 == "-" ? -1 : 1) * ($2.to_i * 3600 + $3.to_i * 60)
          t = Time.at(event.get("@timestamp").to_i + off).utc
          event.set("[windows][hour_n]", t.hour)
          event.set("[windows][weekday]", ["7 Sun", "1 Mon", "2 Tue", "3 Wed", "4 Thu", "5 Fri", "6 Sat"][t.wday])
          event.set("[windows][off_hours]", t.wday == 0 || t.wday == 6 || t.hour < 6 || t.hour >= 20)
        end
      rescue StandardError
      end
      m = event.get("message")
      event.set("message", m.to_s[0, 2048]) if m
      event.remove("[event][original]")
      event.remove("[log]")
    '
  }
  if [source][ip] and [source][ip] !~ /^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|[fF][cdCD]|[fF][eE]80)/ {
    geoip { source => "[source][ip]" target => "[source]" ecs_compatibility => "v8" tag_on_failure => [] }
  }
}

output {
  elasticsearch {
    id => "windows_es"
    hosts => ["https://127.0.0.1:9200"]
    ssl_certificate_authorities => ["/etc/logstash/sentora/http_ca.crt"]
    user => "sentora_logstash"
    password => "${SENTORA_ES_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "windows"
    data_stream_namespace => "default"
  }
}
