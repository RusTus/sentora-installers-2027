# Sentora Elk node: VMware vCenter / ESXi (sentora-elk-node vsphere ADDRESS USER).
#
# Metricbeat on this node (its vSphere module, a read-only vCenter user, vCenter's own certificate pinned) reads every
# host, virtual machine, datastore, cluster, network and resource pool each minute and hands them to this pipeline on
# 127.0.0.1:5519 (on this node only). The figures the dashboards use are copied under vmw.*: what it is (vmw.kind:
# host, vm, datastore, cluster, network, pool), its name, its health (vCenter's green, yellow, red as 1, 0.5, 0), how
# busy (CPU and memory as 0 to 1), how full (datastores), whether a VM runs, its alarms and snapshots.
#
# Written by the Sentora Elk node installer; changes made here are replaced by its next --update.

input {
  beats {
    id => "vsphere_in"
    host => "127.0.0.1"
    port => 5519
    ecs_compatibility => "v8"
  }
}

filter {
  ruby {
    id => "vsphere_sentora"
    init => 'require "time"'
    code => '
      ms = event.get("[metricset][name]").to_s
      v = event.get("vsphere")
      v = {} unless v.is_a?(Hash)
      d = v[ms].is_a?(Hash) ? v[ms] : {}
      g = lambda { |*path| path.reduce(d) { |o, k| o.is_a?(Hash) ? o[k] : nil } }
      num = lambda { |x| x.is_a?(Numeric) ? x.to_f : nil }
      ratio = lambda { |a, b| a = num.call(a); b = num.call(b); a && b && b > 0 ? (a / b).round(4) : nil }
      kind = { "host" => "host", "virtualmachine" => "vm", "datastore" => "datastore", "cluster" => "cluster",
               "network" => "network", "resourcepool" => "pool", "datastorecluster" => "datastore-cluster" }[ms]
      if kind.nil?
        event.tag("vsphere_unknown")
      else
        w = { "kind" => kind }
        w["name"] = g.call("name").to_s[0, 255] if g.call("name")
        st = (g.call("status") || g.call("config", "status")).to_s
        w["status"] = st unless st.empty?
        h = { "green" => 1.0, "yellow" => 0.5, "red" => 0.0 }[st]
        w["health"] = h if h
        case kind
        when "host"
          w["cpu_pct"] = ratio.call(g.call("cpu", "used", "mhz"), g.call("cpu", "total", "mhz"))
          w["mem_pct"] = ratio.call(g.call("memory", "used", "bytes"), g.call("memory", "total", "bytes"))
          w["vms"] = g.call("vm", "count")
          up = num.call(g.call("uptime"))
          w["uptime_days"] = (up / 86400).round(1) if up
        when "vm"
          w["host"] = g.call("host", "hostname").to_s[0, 255] if g.call("host", "hostname")
          c, m = num.call(g.call("cpu", "usage", "percent")), num.call(g.call("memory", "usage", "percent"))
          w["cpu_pct"] = (c / 100).round(4) if c
          w["mem_pct"] = (m / 100).round(4) if m
          up = num.call(g.call("uptime"))
          # (running: up for a while or using CPU; vCenter gives no power state here)
          w["on"] = (!up.nil? && up > 0) || (!c.nil? && c > 0)
          w["uptime_days"] = (up / 86400).round(1) if up
          w["os"] = g.call("os").to_s[0, 128] if g.call("os")
          gb = num.call(g.call("memory", "total", "guest", "bytes"))
          w["mem_gb"] = (gb / 1073741824).round(1) if gb
          snap = g.call("snapshot")
          if snap.is_a?(Hash)
            w["snapshots"] = snap["count"].to_i if snap["count"]
            info = snap["info"].is_a?(Array) ? snap["info"] : []
            oldest = info.map { |s| s.is_a?(Hash) ? (s["createtime"] || s["created"]).to_s : "" }.reject(&:empty?).min
            if oldest
              begin
                w["snapshot_days"] = ((Time.now - Time.parse(oldest)) / 86400).round(1)
              rescue StandardError
              end
            end
          end
        when "datastore"
          w["used_pct"] = num.call(g.call("capacity", "used", "pct"))
          w["used_pct"] ||= ratio.call(g.call("capacity", "used", "bytes"), g.call("capacity", "total", "bytes"))
          f, t = num.call(g.call("capacity", "free", "bytes")), num.call(g.call("capacity", "total", "bytes"))
          w["free_gb"] = (f / 1073741824).round(1) if f
          w["total_gb"] = (t / 1073741824).round(1) if t
          w["vms"] = g.call("vm", "count")
          w["fstype"] = g.call("fstype").to_s[0, 32] if g.call("fstype")
        when "cluster"
          w["hosts"] = g.call("host", "count")
        end
        al = g.call("triggered_alarms")
        if al.is_a?(Array) && !al.empty?
          w["alarms"] = al.size
          worst = al.map { |a| a.is_a?(Hash) ? a : {} }.min_by { |a| { "red" => 0, "yellow" => 1 }[a["status"].to_s] || 2 }
          w["alarm"] = (worst["name"] || worst["description"]).to_s[0, 200]
          w["alarm_status"] = worst["status"].to_s
        else
          w["alarms"] = 0
        end
        event.set("vmw", w.reject { |_, x| x.nil? })
      end
      event.set("[event][module]", "vsphere")
      event.set("[observer][vendor]", "VMware")
      event.set("[observer][product]", "vCenter")
      event.remove("[agent]")
      event.remove("[ecs]")
    '
  }
}

output {
  elasticsearch {
    id => "vsphere_es"
    hosts => ["https://127.0.0.1:9200"]
    ssl_certificate_authorities => ["/etc/logstash/sentora/http_ca.crt"]
    user => "sentora_logstash"
    password => "${SENTORA_ES_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "vsphere"
    data_stream_namespace => "default"
  }
}
