# Sentora Elk node: the panel's logs in, Elasticsearch out.
#
# The panel's rsyslog (the Elk add-on) sends one JSON object per line over TLS on port 6514, and only
# a connection with the panel's own certificate is taken (ssl_certificate_authorities is the panel's
# certificate alone, pinned when the node was installed):
#   {"@timestamp": "...", "sentora_host": "panel.example", "sentora_log": "web-access",
#    "sentora_account": "bob", "sentora_domain": "example.com", "message": "<the log line>"}
# Each kind of log (sentora.log) is read into Elastic Common Schema fields, so the dashboards and
# Discover can count and filter on them. A line that is not understood keeps its message and gets the
# tag sentora_unparsed: nothing is dropped.
#
# Written by the Sentora Elk node installer; changes made here are replaced by its next --update.

input {
  tcp {
    id => "sentora_panel"
    port => 6514
    codec => json_lines { target => "[@metadata][in]" decode_size_limit_bytes => 1048576 }
    ssl_enabled => true
    ssl_certificate => "/etc/logstash/sentora/node.crt"
    ssl_key => "/etc/logstash/sentora/node.key"
    ssl_client_authentication => "required"
    ssl_certificate_authorities => ["/etc/logstash/sentora/panel.crt"]
    ssl_supported_protocols => ["TLSv1.3", "TLSv1.2"]
  }
}

filter {
  # ---- the envelope from the panel: only these fields are taken, anything else in it is left out
  ruby {
    id => "sentora_envelope"
    code => '
      i = event.get("[@metadata][in]")
      i = {} unless i.is_a?(Hash)
      str = lambda { |k, n| v = i[k]; v.is_a?(String) ? v[0, n] : "" }
      event.set("message", str.call("message", 32768).sub(/\A\s+/, ""))
      t = str.call("@timestamp", 64)
      event.set("[@metadata][ts]", t) unless t.empty?
      log = str.call("sentora_log", 32)
      log = "other" unless log.match?(/\A[a-z0-9-]{1,32}\z/)
      event.set("[sentora][log]", log)
      event.set("[event][dataset]", "sentora." + log)
      a = str.call("sentora_account", 64)
      event.set("[sentora][account]", a) unless a.empty?
      d = str.call("sentora_domain", 255).downcase
      event.set("[sentora][domain]", d) unless d.empty?
      h = str.call("sentora_host", 255).downcase
      unless h.empty?
        event.set("[host][name]", h)
        event.set("[sentora][panel]", h)
      end
    '
  }
  date {
    match => ["[@metadata][ts]", "ISO8601"]
    tag_on_failure => []
  }

  # ---- the panel's list of websites (for the uptime checks): kept in a file for the node's own timer, not in the logs
  if [sentora][log] == "sites" {
    ruby {
      id => "sentora_sites"
      code => '
        require "json"
        begin
          list = JSON.parse(event.get("message").to_s)
        rescue StandardError
          list = nil
        end
        out = []
        if list.is_a?(Array)
          list.first(2000).each do |x|
            next unless x.is_a?(Hash)
            h = x["host"].to_s.downcase
            next unless h.match?(/\A[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?\z/) && h.include?(".")
            out << { "host" => h, "https" => x["https"] == true }
          end
        end
        dir = "/var/lib/logstash/sentora"
        if File.directory?(dir)
          tmp = dir + "/sites.json.tmp"
          File.write(tmp, JSON.generate({ "panel" => event.get("[sentora][panel]").to_s, "sites" => out }))
          File.rename(tmp, dir + "/sites.json")
        end
      '
    }
    drop { id => "sentora_sites_drop" }
  }

  # ---- the panel's health (every 5 minutes): only the known figures, only numbers, into sentora.health.*
  if [sentora][log] == "health" {
    ruby {
      id => "sentora_health"
      code => '
        require "json"
        begin
          v = JSON.parse(event.get("message").to_s)
        rescue StandardError
          v = nil
        end
        keys = %w[cpu_pct load1 load5 load15 cpus mem_total mem_used_pct swap_used_pct disk_root_used_pct disk_root_free
                  disk_sites_used_pct disk_sites_free net_rx_bps net_tx_bps apache_busy apache_idle apache_rps
                  mysql_threads mysql_qps mysql_slow_per_min mail_queue]
        if v.is_a?(Hash)
          keys.each do |k|
            x = v[k]
            event.set("[sentora][health][" + k + "]", x.to_f) if x.is_a?(Numeric) && x.to_f.finite? && x >= 0
          end
        end
        event.set("message", "health")
        event.set("[event][kind]", "metric")
      '
    }
  }

  # ---- websites and the panel's own Apache: access logs (combined) and error logs
  if [sentora][log] in ["web-access", "panel-access"] {
    grok {
      id => "sentora_access"
      ecs_compatibility => "v1"
      match => { "message" => "%{HTTPD_COMBINEDLOG}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    if "sentora_unparsed" not in [tags] {
      date { match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"] remove_field => ["timestamp"] }
      mutate { add_field => { "[event][category]" => "web" } }
      ruby {
        code => '
          s = event.get("[http][response][status_code]").to_i
          event.set("[event][outcome]", s >= 400 ? "failure" : "success") if s > 0
          event.set("[sentora][status_class]", (s / 100).to_s + "xx") if s > 0
          ua = event.get("[user_agent][original]").to_s
          event.set("[sentora][bot]", !!(ua =~ /bot|crawl|spider|slurp|fetch|scan|curl|wget|python|go-http|headless|monitor|sitehealth/i) || ua.empty? || ua == "-")
          event.set("[sentora][visitor]", event.get("[sentora][bot]") ? "bot" : "person")
          u = event.get("[url][original]").to_s
          event.set("[url][path]", u.split("?", 2)[0][0, 1024]) unless u.empty?
        '
      }
      if [user_agent][original] {
        useragent { source => "[user_agent][original]" target => "[user_agent]" ecs_compatibility => "v1" }
      }
    }
  } else if [sentora][log] in ["web-error", "panel-error"] {
    grok {
      id => "sentora_apache_error"
      ecs_compatibility => "v1"
      match => { "message" => [
        "^\[%{HTTPDERROR_DATE}\] \[(?:%{WORD:[apache][error][module]})?:%{LOGLEVEL:[log][level]}\] \[pid %{POSINT:[process][pid]:int}(?::tid %{INT:[process][thread][id]:int})?\](?: \[(?:client|remote) %{IP:[source][ip]}:%{POSINT:[source][port]:int}\])? (?:%{DATA:[error][code]}: )?%{GREEDYDATA:[error][message]}"
      ] }
      tag_on_failure => ["sentora_unparsed"]
    }
    mutate { add_field => { "[event][category]" => "web" } }
    # ModSecurity (Web Hardening): one line per rule a request matched, and the anomaly score's verdict
    if [message] =~ /ModSecurity: (Warning|Access denied)/ {
      grok {
        id => "sentora_waf"
        break_on_match => false
        match => { "message" => [
          "ModSecurity: (?<[@metadata][verdict]>Warning|Access denied)",
          "\[id \"%{INT:[rule][id]}\"\]",
          "\[msg \"(?<[rule][name]>[^\"]*)\"\]",
          "\[severity \"%{WORD:[sentora][waf][severity]}\"\]",
          "\[hostname \"(?<[sentora][waf][host]>[^\"]*)\"\]",
          "\[uri \"(?<[url][path]>[^\"]*)\"\]",
          "\[tag \"attack-(?<[sentora][waf][attack]>[a-z-]+)\"\]",
          "Total Score: %{INT:[sentora][waf][score]:int}"
        ] }
        tag_on_failure => []
      }
      mutate { replace => { "[event][category]" => "intrusion_detection" } add_field => { "[event][module]" => "modsecurity" } }
      if [rule][id] in ["949110", "959100"] {
        if [@metadata][verdict] == "Access denied" {
          mutate { add_field => { "[event][action]" => "waf-blocked" "[event][outcome]" => "failure" } }
        } else {
          mutate { add_field => { "[event][action]" => "waf-watched" } }
        }
      } else if [rule][id] =~ /^98/ {
        mutate { add_field => { "[event][action]" => "waf-report" } }
      } else {
        mutate { add_field => { "[event][action]" => "waf-rule" } }
      }
      if [sentora][waf][host] and ![sentora][domain] { mutate { copy => { "[sentora][waf][host]" => "[sentora][domain]" } } }
    }

  # ---- lines rsyslog takes from the journal, by program: "postfix/smtpd[123]: <message>"
  } else if [sentora][log] in ["mail", "auth"] {
    grok {
      id => "sentora_syslog"
      match => { "message" => "^%{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?:\s*%{GREEDYDATA:[@metadata][msg]}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    if [sentora][log] == "mail" {
      mutate { add_field => { "[event][category]" => "email" } }
      grok {
        id => "sentora_postfix"
        break_on_match => true
        match => { "[@metadata][msg]" => [
          "^%{NOTSPACE:[sentora][mail][queue_id]}: to=<%{DATA:[email][to][address]}>,(?: orig_to=<%{DATA}>,)? relay=%{NOTSPACE:[sentora][mail][relay]},.*? status=%{WORD:[sentora][mail][status]}(?: \(%{DATA:[sentora][mail][reason]}\))?$",
          "^%{NOTSPACE:[sentora][mail][queue_id]}: from=<%{DATA:[email][from][address]}>, size=%{INT:[email][size]:int}",
          "^NOQUEUE: reject: %{WORD} from %{DATA}\[%{IP:[source][ip]}\]: %{INT} %{DATA:[sentora][mail][reason]}; from=<%{DATA:[email][from][address]}> to=<%{DATA:[email][to][address]}>",
          "^warning: %{DATA}\[%{IP:[source][ip]}\]: SASL %{WORD} authentication failed",
          "^%{NOTSPACE:[sentora][mail][queue_id]}: client=%{DATA}\[%{IP:[source][ip]}\](?:, sasl_method=%{WORD}, sasl_username=%{NOTSPACE:[user][name]})?",
          "^(?:dis)?connect from %{DATA}\[%{IP:[source][ip]}\]"
        ] }
        tag_on_failure => []
      }
      if [process][name] =~ /^spamd/ {
        # SpamAssassin: "result: Y 12 - RULES,... scantime=0.4,size=2345,user=box@example.com,...,mid=<id@host>,..."
        grok {
          id => "sentora_spamd"
          break_on_match => false
          match => { "[@metadata][msg]" => [
            "result: (?<[@metadata][flag]>[Y.]) %{NUMBER:[sentora][mail][spam_score]:float} - (?<[sentora][mail][spam_rules]>\S*)",
            "[ ,]user=(?<[user][name]>[^,\s]+)"
          ] }
          tag_on_failure => []
        }
        if [@metadata][flag] == "Y" {
          mutate { replace => { "[sentora][mail][status]" => "spam" } }
        } else if [@metadata][flag] == "." {
          mutate { replace => { "[sentora][mail][status]" => "clean" } }
        }
        if [sentora][mail][spam_rules] { mutate { split => { "[sentora][mail][spam_rules]" => "," } } }
      }
      if [@metadata][msg] =~ /^NOQUEUE: reject/ {
        mutate { replace => { "[sentora][mail][status]" => "rejected" } add_field => { "[event][outcome]" => "failure" } }
      } else if [@metadata][msg] =~ /SASL \w+ authentication failed/ {
        mutate { replace => { "[sentora][mail][status]" => "login-failed" } add_field => { "[event][outcome]" => "failure" "[event][action]" => "mail-login" } }
      } else if [sentora][mail][status] == "sent" {
        mutate { add_field => { "[event][outcome]" => "success" } }
      } else if [sentora][mail][status] in ["bounced", "deferred", "expired"] {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      }
    } else {
      mutate { add_field => { "[event][category]" => "authentication" } }
      grok {
        id => "sentora_auth"
        match => { "[@metadata][msg]" => [
          "^Accepted %{WORD:[sentora][auth][method]} for %{USERNAME:[user][name]} from %{IP:[source][ip]}",
          "^Failed %{WORD:[sentora][auth][method]} for (?:invalid user )?%{DATA:[user][name]} from %{IP:[source][ip]}",
          "^Invalid user %{DATA:[user][name]} from %{IP:[source][ip]}",
          "^\s*%{USERNAME:[user][name]} : .*?USER=%{USERNAME:[user][target][name]} ; COMMAND=%{GREEDYDATA:[process][command_line]}"
        ] }
        tag_on_failure => []
      }
      if [@metadata][msg] =~ /^Accepted / {
        mutate { add_field => { "[event][action]" => "ssh-login" "[event][outcome]" => "success" } }
      } else if [@metadata][msg] =~ /^(Failed |Invalid user )/ {
        mutate { add_field => { "[event][action]" => "ssh-login" "[event][outcome]" => "failure" } }
      } else if [process][command_line] {
        mutate { add_field => { "[event][action]" => "sudo" } }
      }
    }

  # ---- Dovecot's own files: "2026-11-20 20:08:33 imap-login: Info: Login: user=<a@b>, method=PLAIN, rip=1.2.3.4, ..."
  } else if [sentora][log] == "dovecot" {
    grok {
      id => "sentora_dovecot"
      match => { "message" => "^%{TIMESTAMP_ISO8601} %{NOTSPACE:[@metadata][svc]}: %{WORD:[log][level]}: %{GREEDYDATA:[@metadata][msg]}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    mutate { add_field => { "[event][category]" => "email" } }
    grok {
      id => "sentora_dovecot_svc"
      match => { "[@metadata][svc]" => "^%{WORD:[process][name]}(?:-login)?(?:\(%{DATA:[user][name]}\))?" }
      tag_on_failure => []
    }
    if [@metadata][msg] =~ /^Login: / {
      grok { match => { "[@metadata][msg]" => "user=<%{DATA:[user][name]}>.*? rip=%{IP:[source][ip]}" } overwrite => ["[user][name]"] tag_on_failure => [] }
      mutate { add_field => { "[event][action]" => "mail-login" "[event][outcome]" => "success" } }
    } else if [@metadata][msg] =~ /auth.failed|auth_failed|password mismatch/ {
      grok { match => { "[@metadata][msg]" => "user=<%{DATA:[user][name]}>.*? rip=%{IP:[source][ip]}" } overwrite => ["[user][name]"] tag_on_failure => [] }
      mutate { add_field => { "[event][action]" => "mail-login" "[event][outcome]" => "failure" "[sentora][mail][status]" => "login-failed" } }
    } else if [@metadata][msg] =~ /rip=/ {
      grok { match => { "[@metadata][msg]" => "rip=%{IP:[source][ip]}" } tag_on_failure => [] }
    }
    if [user][name] == "" { mutate { remove_field => ["[user][name]"] } }

  # ---- the panel's own login guard: "2026-11-20 20:13:00 Sentora panel login failed for 'bob' from 1.2.3.4"
  } else if [sentora][log] == "panel-login" {
    grok {
      id => "sentora_panel_login"
      match => { "message" => "login failed for '%{DATA:[user][name]}' from %{IP:[source][ip]}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    mutate { add_field => { "[event][category]" => "authentication" "[event][action]" => "panel-login" "[event][outcome]" => "failure" } }

  # ---- Roundcube (webmail): "[20-Nov-2026 20:00:00 +0000]: <sess> Failed login for a@b from 1.2.3.4 in session ..."
  } else if [sentora][log] == "webmail" {
    grok {
      id => "sentora_webmail"
      match => { "message" => "Failed login for %{DATA:[user][name]} from %{IP:[source][ip]}" }
      tag_on_failure => []
    }
    if [source][ip] {
      mutate { add_field => { "[event][category]" => "authentication" "[event][action]" => "webmail-login" "[event][outcome]" => "failure" } }
    }

  # ---- ProFTPD: logins (auth.log) and file actions (access.log)
  } else if [sentora][log] == "ftp-login" {
    grok {
      id => "sentora_ftp_login"
      match => { "message" => "^.*? \[%{POSINT:[process][pid]:int}\] %{IP:[source][ip]} \[%{HTTPDATE}\] \"%{WORD:[@metadata][cmd]}(?: %{DATA:[@metadata][arg]})?\" %{INT:[@metadata][code]:int}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    if [@metadata][cmd] == "USER" { mutate { copy => { "[@metadata][arg]" => "[user][name]" } } }
    if [@metadata][cmd] == "PASS" {
      if [@metadata][code] == 230 {
        mutate { add_field => { "[event][category]" => "authentication" "[event][action]" => "ftp-login" "[event][outcome]" => "success" } }
      } else if [@metadata][code] == 530 {
        mutate { add_field => { "[event][category]" => "authentication" "[event][action]" => "ftp-login" "[event][outcome]" => "failure" } }
      }
    }
  } else if [sentora][log] == "ftp" {
    grok {
      id => "sentora_ftp"
      match => { "message" => "^%{IP:[source][ip]} %{NOTSPACE} %{NOTSPACE:[user][name]} \[%{HTTPDATE}\] \"%{WORD:[sentora][ftp][command]}(?: %{DATA:[file][path]})?\" %{INT:[sentora][ftp][code]:int} %{NOTSPACE:[@metadata][bytes]}" }
      tag_on_failure => ["sentora_unparsed"]
    }
    if [@metadata][bytes] =~ /^\d+$/ { mutate { add_field => { "[sentora][ftp][bytes]" => "%{[@metadata][bytes]}" } } }
    mutate { convert => { "[sentora][ftp][bytes]" => "integer" } add_field => { "[event][category]" => "file" } }

  # ---- BIND: "20-Nov-2026 20:11:16.116 general: notice: all zones loaded"
  } else if [sentora][log] == "dns" {
    grok {
      id => "sentora_dns"
      match => { "message" => "^%{NOTSPACE} %{TIME} %{NOTSPACE:[sentora][dns][category]}: %{WORD:[log][level]}: %{GREEDYDATA}" }
      tag_on_failure => ["sentora_unparsed"]
    }

  # ---- fail2ban: "2026-11-20 10:00:00,123 fail2ban.actions [123]: NOTICE  [sshd] Ban 1.2.3.4"
  } else if [sentora][log] == "fail2ban" {
    grok {
      id => "sentora_fail2ban"
      match => { "message" => [
        "^%{TIMESTAMP_ISO8601}\s+%{NOTSPACE}\s+\[%{POSINT}\]: %{LOGLEVEL:[log][level]}\s+\[%{DATA:[rule][name]}\] (?<[event][action]>Ban|Unban|Restore Ban|Found) %{IP:[source][ip]}",
        "^%{TIMESTAMP_ISO8601}\s+%{NOTSPACE}\s+\[%{POSINT}\]: %{LOGLEVEL:[log][level]}\s+"
      ] }
      tag_on_failure => ["sentora_unparsed"]
    }
    mutate { add_field => { "[event][category]" => "intrusion_detection" } }
    if [event][action] { mutate { lowercase => ["[event][action]"] gsub => ["[event][action]", "restore ban", "ban"] } }

  # ---- what the panel asked root to do (zsudo), the daemon, the problems log: the line as it is
  } else if [sentora][log] == "zsudo" {
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601}\s+(?<[event][action]>ran|refused|dropped) %{GREEDYDATA:[sentora][zsudo][job]}" }
      tag_on_failure => []
    }
  }

  # ---- the domain part of mail addresses (where mail went, who sent it)
  ruby {
    code => '
      t = event.get("[email][to][address]")
      event.set("[email][to][domain]", t.split("@", 2)[1].to_s.downcase) if t.is_a?(String) && t.include?("@")
      f = event.get("[email][from][address]")
      event.set("[email][from][domain]", f.split("@", 2)[1].to_s.downcase) if f.is_a?(String) && f.include?("@")
    '
  }

  # ---- where visitors and attackers come from (Elastic's free GeoLite2 database, updated by Logstash)
  if [source][address] and ![source][ip] {
    if [source][address] =~ /^[0-9a-fA-F:.]+$/ { mutate { copy => { "[source][address]" => "[source][ip]" } } }
  }
  if [source][ip] {
    if [source][ip] !~ /^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|[fF][cdCD]|[fF][eE]80)/ {
      geoip { source => "[source][ip]" target => "[source]" ecs_compatibility => "v8" tag_on_failure => [] }
    }
  }
}

output {
  elasticsearch {
    id => "sentora_es"
    hosts => ["https://127.0.0.1:9200"]
    ssl_certificate_authorities => ["/etc/logstash/sentora/http_ca.crt"]
    user => "sentora_logstash"
    password => "${SENTORA_ES_PASSWORD}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "sentora"
    data_stream_namespace => "default"
  }
}
