##
## Dovecot config file for Sentora
## Dovecot 2.4 format (Ubuntu 26.04 ships Dovecot 2.4.x)
##
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

listen = *
# Passwords only over TLS. Webmail on this server (localhost) is still allowed.
auth_allow_cleartext = no
ssl = yes
# Certificate made by the installer (self-signed until replaced, see ssl/README)
ssl_server_cert_file = /etc/sentora/configs/ssl/sentora.crt
ssl_server_key_file = /etc/sentora/configs/ssl/sentora.key
ssl_min_protocol = TLSv1.2
# The same modern ciphers as the web server (forward secrecy, AES-GCM or ChaCha20;
# no CBC); TLS 1.3 uses its own, always modern, set
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
log_timestamp = "%Y-%m-%d %H:%M:%S "
protocols = imap pop3 lmtp sieve
auth_mechanisms = plain login
# Sentora stores mailbox passwords as MD5-CRYPT, which Dovecot 2.4 refuses by default
auth_allow_weak_schemes = yes

# SQL connection, passdb and userdb queries (password and uid/gid are filled in by the installer)
!include /etc/sentora/configs/dovecot2/dovecot-mysql.conf

mail_driver = maildir
mail_path = /var/sentora/vmail/%{user | domain}/%{user | username}
#first_valid_uid = ?
mailbox_idle_check_interval = 30 secs
maildir_copy_with_hardlinks = yes

# Default namespace. trash_priority sets which folders the trash plugin
# empties first when a user goes over quota (was dovecot-trash.conf).
namespace inbox {
  inbox = yes
  mailbox Spam {
    trash_priority = 1
  }
  mailbox Trash {
    trash_priority = 2
  }
  mailbox Junk {
    trash_priority = 3
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service lmtp {
  unix_listener lmtp {
  }
}
service imap {
  vsz_limit = 256M
}
service pop3 {
}
service auth {
  unix_listener auth-userdb {
    mode = 0666
    user = vmail
    group = mail
  }
  # SMTP AUTH for Postfix
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
}
service auth-worker {
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  restart_request_count = 1
  process_min_avail = 0
  vsz_limit = 64M
}
service managesieve {
}

lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes
lmtp_save_to_detail_mailbox = yes

protocol lda {
  mail_plugins {
    quota = yes
    sieve = yes
  }
  postmaster_address = !POSTMASTER_EMAIL!
}
protocol imap {
  mail_plugins {
    quota = yes
    imap_quota = yes
    trash = yes
  }
  imap_client_workarounds {
    delay-newmail = yes
  }
}
protocol lmtp {
  mail_plugins {
    quota = yes
    sieve = yes
  }
}
protocol pop3 {
  mail_plugins {
    quota = yes
  }
  pop3_client_workarounds {
    outlook-no-nuls = yes
    oe-ns-eoh = yes
  }
  pop3_uidl_format = %{uid | hex(8)}%{uidvalidity | hex(8)}
}
protocol sieve {
  managesieve_max_line_length = 65536
  managesieve_implementation_string = Dovecot Pigeonhole
  managesieve_max_compile_errors = 5
}

# Maildir++ quota. The per-user limit comes from the userdb (quota_storage_size).
quota "User quota" {
  driver = maildir
}

# Personal Sieve scripts (managed through ManageSieve)
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/dovecot.sieve
}
# Used when the user has no active personal script. Pointing path at the file
# itself matters: with Pigeonhole 2.4.2 a folder + name fails on every delivery
# ("active sieve symlink '(null)'") and mail stays queued.
sieve_script default {
  type = default
  driver = file
  path = /var/sentora/sieve/globalfilter.sieve
}
# Spam handling chosen in Mail > SpamAV (one script per mailbox, run before the user's own)
sieve_script spamav {
  type = before
  driver = file
  path = /var/sentora/sieve/spamav/%{user | lower}.sieve
}
# Location for :global includes
sieve_script global {
  type = global
  driver = file
  path = /var/sentora/sieve/
}
sieve_max_script_size = 1M

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
debug_log_path = /var/log/dovecot-debug.log
