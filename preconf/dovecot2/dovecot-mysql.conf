##
## Sentora SQL settings for Dovecot 2.4
## Included from dovecot.conf. The installer fills in the password and uid/gid.
##
## Each mailbox's Dovecot home (Sieve scripts, duplicate-delivery database) is
## kept beside the mail, in <domain>/.home/<user>: inside the maildir those
## files showed up as folders ("dovecot", "dovecot.lda-dupes") on phones.
##
sql_driver = mysql

mysql localhost {
  user = postfix
  password = !POSTFIX_PASSWORD!
  dbname = sentora_postfix
}

passdb sql {
  default_password_scheme = MD5-CRYPT
  query = SELECT username AS user, password, \
    concat('/var/sentora/vmail/', domain, '/.home/', local_part) AS userdb_home, \
    'maildir' AS userdb_mail_driver, \
    concat('/var/sentora/vmail/', maildir) AS userdb_mail_path, \
    !DOV_UID! AS userdb_uid, !DOV_GID! AS userdb_gid, \
    IF(quota > 0, concat(quota, 'M'), 'unlimited') AS userdb_quota_storage_size \
    FROM mailbox WHERE username = '%{user}' AND active = '1'
}

userdb prefetch {
}

userdb sql {
  query = SELECT concat('/var/sentora/vmail/', domain, '/.home/', local_part) AS home, \
    'maildir' AS mail_driver, \
    concat('/var/sentora/vmail/', maildir) AS mail_path, \
    !DOV_UID! AS uid, !DOV_GID! AS gid, \
    IF(quota > 0, concat(quota, 'M'), 'unlimited') AS quota_storage_size \
    FROM mailbox WHERE username = '%{user}' AND active = '1'
  iterate_query = SELECT username AS user FROM mailbox WHERE active = '1'
}
