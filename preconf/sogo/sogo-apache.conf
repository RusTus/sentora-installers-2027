# SOGo groupware and ActiveSync for Sentora (installed as
# /etc/apache2/conf-available/sogo.conf and enabled with a2enconf sogo).
# SOGo itself listens on 127.0.0.1:20000 only.
Alias /SOGo.woa/WebServerResources/ /usr/lib/x86_64-linux-gnu/GNUstep/SOGo/WebServerResources/
Alias /SOGo/WebServerResources/ /usr/lib/x86_64-linux-gnu/GNUstep/SOGo/WebServerResources/
<Directory /usr/lib/x86_64-linux-gnu/GNUstep/SOGo/>
    AllowOverride None
    Require all granted
    <IfModule expires_module>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </IfModule>
</Directory>

<Location /SOGo>
    Header set Cache-Control "max-age=0, no-cache, no-store"
</Location>

ProxyRequests Off
ProxyPreserveHost On
SetEnv proxy-nokeepalive 1

# ActiveSync first: its worker is the more specific one (phones keep a request
# open for up to an hour, so it gets a long timeout)
ProxyPass /Microsoft-Server-ActiveSync http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync retry=60 connectiontimeout=5 timeout=3660
# Web interface, CalDAV and CardDAV
ProxyPass /SOGo http://127.0.0.1:20000/SOGo retry=0 nocanon timeout=3660

<Proxy http://127.0.0.1:20000/SOGo>
    RequestHeader set "x-webobjects-server-port" "443"
    SetEnvIf Host (.*) HTTP_HOST=$1
    RequestHeader set "x-webobjects-server-name" "%{HTTP_HOST}e" env=HTTP_HOST
    RequestHeader set "x-webobjects-server-url" "https://%{HTTP_HOST}e" env=HTTP_HOST
    # Never let a client claim to be someone
    RequestHeader unset "x-webobjects-remote-user"
    RequestHeader set "x-webobjects-server-protocol" "HTTP/1.0"
    AddDefaultCharset UTF-8
    Require all granted
</Proxy>

# On or off from Admin > Mail Config (written by the Sentora daemon)
IncludeOptional /etc/sentora/configs/sogo/activesync-access.conf

<IfModule rewrite_module>
    RewriteEngine On
    RewriteRule ^/.well-known/caldav/?$ /SOGo/dav [R=301]
    RewriteRule ^/.well-known/carddav/?$ /SOGo/dav [R=301]
</IfModule>
