/*
 * SOGo groupware for Sentora (webmail, calendars, contacts, and ActiveSync for
 * phones and Outlook). Installed as /etc/sogo/sogo.conf by the installer, which
 * fills in the !PLACEHOLDERS!. Readable by root and the sogo user only.
 *
 * Users are the panel's mailboxes (full email address + mailbox password),
 * read through the view sentora_postfix.sogo_users.
 */
{
  /* SOGo's own data (preferences, calendars, contacts, sessions) */
  SOGoProfileURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_sogo/sogo_user_profile";
  OCSFolderInfoURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_sogo/sogo_folder_info";
  OCSSessionsFolderURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_sogo/sogo_sessions_folder";
  OCSEMailAlarmsFolderURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_sogo/sogo_alarms_folder";
  OCSAdminURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_sogo/sogo_admin";

  /* Log in with the mailbox address and password from the panel */
  SOGoUserSources = (
    {
      type = sql;
      id = sentora_mailboxes;
      viewURL = "mysql://sogo:!SOGO_PASSWORD!@127.0.0.1:!MYSQL_PORT!/sentora_postfix/sogo_users";
      canAuthenticate = YES;
      isAddressBook = YES;
      displayName = "Mail accounts";
      userPasswordAlgorithm = md5;
      prependPasswordScheme = NO;
      listRequiresDot = NO;
    }
  );

  /* Mail on this server. Localhost connections need no TLS (Dovecot and
     Postfix trust 127.0.0.1); everything else uses the services' own TLS. */
  SOGoIMAPServer = "imap://127.0.0.1:143/?tls=NO";
  SOGoSieveServer = "sieve://127.0.0.1:4190/?tls=NO";
  SOGoSMTPServer = "smtp://127.0.0.1:25";
  SOGoMailingMechanism = smtp;
  NGImap4ConnectionStringSeparator = ".";
  SOGoDraftsFolderName = Drafts;
  SOGoSentFolderName = Sent;
  SOGoTrashFolderName = Trash;
  SOGoJunkFolderName = Spam;
  SOGoMailDomain = "!PANEL_FQDN!";
  /* Passwords are changed in the panel or in webmail (Roundcube) */
  SOGoPasswordChangeEnabled = NO;


  /* Server */
  WOPort = "127.0.0.1:20000";
  WOLogFile = "/var/log/sogo/sogo.log";
  SOGoMemcachedHost = "127.0.0.1";

  /* ActiveSync (phones, tablets, Outlook) */
  SOGoInternalSyncInterval = 30;
  WOWatchDogRequestTimeout = 65;
  SOGoMaximumSyncResponseSize = 5172;

  /* --- Settings from Admin > Mail Config (rewritten by the Sentora daemon) --- */
  /* --- end of Sentora settings --- */
}
