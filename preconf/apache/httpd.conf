# Sentora Apache Include file
# Written by Bobby Allen, 15/05/2011

# Set the Sentora Alias (used for development, sable will eventually use a VHOST)
#Alias /Sentora /etc/sentora/panel

# Set a default server name for the master configuration to supress Apache daemon warnings
ServerName localhost

# Setup the directory settings and PHP security flags for the Sentora application directory.
<Directory /etc/sentora/panel>
    Options +FollowSymLinks
    DirectoryIndex index.php index.html
    <IfModule mod_php5.c>
        AddType application/x-httpd-php .php
        php_flag magic_quotes_gpc Off
        php_flag track_vars On
        php_flag register_globals Off
        php_admin_value upload_tmp_dir /var/sentora/temp
    </IfModule>
</Directory>

# Disallow web access to directories that don't need it/that we don't want people looking in!
<Directory /etc/sentora/panel/cnf/>
    Order deny,allow 
    Deny from all
</Directory>
<Directory /etc/sentora/panel/modules/*/hooks>
    Order deny,allow 
    Deny from all
</Directory>

# Set server tokens
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# TLS for the panel and every HTTPS site: TLS 1.2 and 1.3 only, and only modern
# ciphers (forward secrecy, AES-GCM or ChaCha20; no CBC, no plain RSA key exchange).
# This is Mozilla's "intermediate" set: works with every browser of the last ten years
# or so; only very old clients (Internet Explorer on Windows 7, Android 4) can not connect.
<IfModule mod_ssl.c>
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off
</IfModule>
# HTTP/2 where the browser supports it (needs the event engine: PHP runs in PHP-FPM)
Protocols h2 http/1.1

# ModSecurity, when the Web Hardening add-on switches it on (empty otherwise)
IncludeOptional /etc/sentora/configs/apache/modsecurity.d/*.conf

# Now we include the generic VHOST configuration file that holds all Sentora user hosted vhost data
Include /etc/sentora/configs/apache/httpd-vhosts.conf
