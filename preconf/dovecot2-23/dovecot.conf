# Sentora: Dovecot 2.3 (AlmaLinux 10). The same settings as preconf/dovecot2/dovecot.conf, which is
# written for Dovecot 2.4 (Ubuntu 26.04, Debian 13), in Dovecot 2.3's syntax.
listen = *
disable_plaintext_auth = yes
ssl = yes
ssl_cert = </etc/sentora/configs/ssl/sentora.crt
ssl_key = </etc/sentora/configs/ssl/sentora.key
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
ssl_prefer_server_ciphers = yes
log_timestamp = "%Y-%m-%d %H:%M:%S "
protocols = imap pop3 lmtp sieve
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/sentora/configs/dovecot2/dovecot-mysql.conf
}
userdb {
  driver = prefetch
}
userdb {
  driver = sql
  args = /etc/sentora/configs/dovecot2/dovecot-mysql.conf
}

mail_location = maildir:/var/sentora/vmail/%d/%n
mailbox_idle_check_interval = 30 secs
maildir_copy_with_hardlinks = yes
#first_valid_uid = ?

namespace inbox {
  inbox = yes
  mailbox Spam {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service lmtp {
  unix_listener lmtp {
  }
}
service imap {
  vsz_limit = 256M
}
service pop3 {
}
service auth {
  unix_listener auth-userdb {
    mode = 0666
    user = vmail
    group = mail
  }
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
}
service auth-worker {
}
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  service_count = 1
  process_min_avail = 0
  vsz_limit = 64M
}
service managesieve {
}

lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes
lmtp_save_to_detail_mailbox = yes
protocol lda {
  mail_plugins = $mail_plugins quota sieve
  postmaster_address = !POSTMASTER_EMAIL!
}
protocol imap {
  mail_plugins = $mail_plugins quota imap_quota trash
  imap_client_workarounds = delay-newmail
}
protocol lmtp {
  mail_plugins = $mail_plugins quota sieve
  postmaster_address = !POSTMASTER_EMAIL!
}
protocol pop3 {
  mail_plugins = $mail_plugins quota
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_uidl_format = %08Xu%08Xv
}
protocol sieve {
  managesieve_max_line_length = 65536
  managesieve_implementation_string = Dovecot Pigeonhole
  managesieve_max_compile_errors = 5
}

plugin {
  quota = maildir:User quota
  trash = /etc/sentora/configs/dovecot2/dovecot-trash.conf
  sieve = file:~/sieve;active=~/dovecot.sieve
  sieve_default = /var/sentora/sieve/globalfilter.sieve
  sieve_global = /var/sentora/sieve/
  sieve_max_script_size = 1M
}

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
debug_log_path = /var/log/dovecot-debug.log
