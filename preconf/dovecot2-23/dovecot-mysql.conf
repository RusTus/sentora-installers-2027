# Sentora: Dovecot 2.3 (AlmaLinux 10). The same lookups as preconf/dovecot2/dovecot-mysql.conf
# (Dovecot 2.4), in Dovecot 2.3's syntax.
driver = mysql
connect = host=localhost dbname=sentora_postfix user=postfix password=!POSTFIX_PASSWORD!
default_pass_scheme = MD5-CRYPT
password_query = SELECT username AS user, password, \
  concat('/var/sentora/vmail/', domain, '/.home/', local_part) AS userdb_home, \
  concat('maildir:/var/sentora/vmail/', maildir) AS userdb_mail, \
  !DOV_UID! AS userdb_uid, !DOV_GID! AS userdb_gid, \
  IF(quota > 0, concat('*:storage=', quota, 'M'), '*:storage=0') AS userdb_quota_rule \
  FROM mailbox WHERE username = '%u' AND active = '1'
user_query = SELECT concat('/var/sentora/vmail/', domain, '/.home/', local_part) AS home, \
  concat('maildir:/var/sentora/vmail/', maildir) AS mail, \
  !DOV_UID! AS uid, !DOV_GID! AS gid, \
  IF(quota > 0, concat('*:storage=', quota, 'M'), '*:storage=0') AS quota_rule \
  FROM mailbox WHERE username = '%u' AND active = '1'
iterate_query = SELECT username AS user FROM mailbox WHERE active = '1'
