# phpMyAdmin failed logins, from its own log file (AuthLog in config.inc.php):
#   Nov 05 12:00:00 phpmyadmin: user denied: root (mysql-denied) from 203.0.113.9
# The user name is typed by the person logging in, so the pattern is anchored to the
# end of the line, where phpMyAdmin writes the real address.
[Definition]
failregex = ^ phpmyadmin: user denied: .* \((?:mysql|empty|allow|root)-denied\) from <HOST>$
ignoreregex =
datepattern = ^%%b %%d %%H:%%M:%%S
