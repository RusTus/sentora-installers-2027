# Dovecot 2.4 as set up by Sentora (its own log files, 2.4 message format):
# "imap-login: Info: Login aborted: Connection closed (auth failed, 1 attempts in 2 secs) ... rip=1.2.3.4,"
[Definition]
failregex = ^ (?:imap|pop3|managesieve|submission|lmtp)-login: Info: .*\(auth failed, \d+ attempts? in \d+ secs?\).* rip=<HOST>,
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
