# fail2ban jails for a Sentora server (installed as /etc/fail2ban/jail.d/sentora.conf)
# An address that fails 5 times within 10 minutes is blocked for an hour.
# Unban: fail2ban-client set <jail> unbanip <address>   List: fail2ban-client status <jail>

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
ignoreip = 127.0.0.1/8 ::1 !SERVER_IP!

[sshd]
enabled = true
backend = systemd

[postfix-sasl]
enabled  = true
filter   = postfix[mode=auth]
backend  = systemd
journalmatch = _SYSTEMD_UNIT=postfix@-.service

[sentora-dovecot]
enabled = true
backend = auto
filter  = sentora-dovecot
port    = pop3,pop3s,imap,imaps,submission,submissions,sieve
logpath = /var/log/dovecot-info.log
          /var/log/dovecot.log

[roundcube-auth]
enabled = true
backend = auto
logpath = /var/sentora/logs/roundcube/errors.log

[sentora-proftpd]
enabled = true
backend = auto
filter  = sentora-proftpd
port    = ftp,ftp-data,ftps,ftps-data
logpath = /var/sentora/logs/proftpd/auth.log

[sentora-panel]
enabled = true
# (polling: the file is checked once a second; a folder watcher (pyinotify, chosen by "auto" where it
# is installed) would need to list /var/lib/sentora, which SELinux rightly does not allow fail2ban)
backend = polling
filter  = sentora-panel
port    = http,https
logpath = /var/lib/sentora/sentora-auth.log

[sentora-phpmyadmin]
# phpMyAdmin accepts MySQL root, and MySQL itself does not slow down password guessing
enabled = true
backend = polling
filter  = sentora-phpmyadmin
port    = http,https
logpath = /var/lib/sentora/phpmyadmin-auth.log
