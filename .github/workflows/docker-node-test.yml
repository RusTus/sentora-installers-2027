# Docker Hosting node test: a real AlmaLinux 10, Rocky Linux 10, Fedora 45, Debian 13 and Ubuntu 26.04 in a container
# with systemd is made a node with docker-node/sentora2027-docker-node and linked to a stand-in panel running the add-on
# (sentora-repo/docker_hosting.zpp); it must then really run an app (rootless Podman as the customer's
# user, limits held, Caddy with the setup password, public, restart, delete). Also runs the add-on's
# own tests (tests/docker_hosting/run.sh). Results kept 14 days.
# The script that does the work: .github/scripts/docker-node-test.sh.
name: Docker node test

on:
  workflow_dispatch:
  push:
    branches: [master2027, docker-hosting]
    paths:
      - docker-node/**
      - sentora-repo/docker_hosting.zpp
      - tests/docker_hosting/**
      - .github/scripts/docker-node-test.sh
      - .github/workflows/docker-node-test.yml

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: [alma10, rocky10, fedora45, debian13, ubuntu26.04]
    steps:
      - uses: actions/checkout@v5
      - name: PHP for the stand-in panel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pdo_sqlite, pdo_mysql, curl
          coverage: none
          ini-values: opcache.jit=disable
      - name: The add-on's own tests (SQLite, MySQL 8.4, MariaDB 10.11 and 11.8)
        if: matrix.system == 'alma10'
        run: |
          tests/docker_hosting/run.sh
          for db in mysql:8.4 mariadb:10.11 mariadb:11.8; do
            echo "::group::$db"
            docker run -d --name testdb -e MYSQL_ROOT_PASSWORD=t -e MARIADB_ROOT_PASSWORD=t -p 127.0.0.1:13306:3306 docker.io/library/$db > /dev/null
            for _ in $(seq 1 60); do php -r 'new PDO("mysql:host=127.0.0.1;port=13306", "root", "t");' 2> /dev/null && break; sleep 2; done
            DH_MYSQL="127.0.0.1;13306;root;t;dhtest" tests/docker_hosting/run.sh || fail=1
            docker rm -f testdb > /dev/null
            echo "::endgroup::"
          done
          exit ${fail:-0}
      - name: Real node
        run: |
          mkdir -p /tmp/mod && unzip -q sentora-repo/docker_hosting.zpp -d /tmp/mod
          .github/scripts/docker-node-test.sh /tmp/mod results ${{ matrix.system }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-node-test-${{ matrix.system }}
          path: results
          retention-days: 14
