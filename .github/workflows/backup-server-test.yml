# Sentora backup server test: each supported system in a container with systemd is made a backup server
# (backup/sentora2027-backup-server) and used over real SSH and rsync as a panel would, including what it
# must refuse. The script: .github/scripts/backup-server-test.sh. Results kept 14 days.
name: Backup server test

on:
  workflow_dispatch:
  push:
    branches: [master2027, docker-hosting]
    paths:
      - backup/**
      - .github/scripts/backup-server-test.sh
      - .github/workflows/backup-server-test.yml

permissions:
  contents: read

jobs:
  backup-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [alma10, rocky10, fedora45, debian13, ubuntu26.04]
    steps:
      - uses: actions/checkout@v5
      - name: rsync on the runner
        run: command -v rsync || sudo apt-get install -y rsync
      - name: Backup server
        run: .github/scripts/backup-server-test.sh results ${{ matrix.system }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-server-test-${{ matrix.system }}
          path: results
          retention-days: 14
