# Add-ons: what Repo Browser offers (sentora-repo/*.zpp) must be what is in addons/<name>/ (addons/check.sh:
# same files, version and SHA256SUMS line), and the add-ons that have tests (tests/<name>/run.sh) pass them,
# run on their folder. An add-on is changed in its folder and built with addons/build.sh <name>.
name: Add-ons

on:
  workflow_dispatch:
  push:
    branches: [master2027]
    paths:
      - addons/**
      - sentora-repo/**
      - tests/**
      - .github/workflows/addons.yml
  pull_request:
    paths:
      - addons/**
      - sentora-repo/**
      - tests/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Every .zpp matches its folder
        run: addons/check.sh
      - name: Built again, the same zips
        run: |
          addons/build.sh $(cd addons && ls -d */ | tr -d /)
          git diff --stat --exit-code sentora-repo/ || { echo "::error::addons/build.sh gives other zips than the ones in sentora-repo/: build them with addons/build.sh and commit"; exit 1; }

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        addon: [docker_hosting, payment_plans, php_hardening, zgod]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Payment Plans' test upgrades from an old version taken from git history
      - name: PHP for the tests
        run: php -m | grep -qi sodium && php -m | grep -qi pdo_sqlite || sudo apt-get install -y php-cli php-sqlite3 php-curl
      - name: Tests of ${{ matrix.addon }}
        run: bash tests/${{ matrix.addon }}/run.sh "$PWD/addons/${{ matrix.addon }}"
      - name: Payment Plans on MySQL 8.4, MariaDB 10.11 and 11.8 (the panel's databases)
        if: matrix.addon == 'payment_plans'
        run: |
          php -m | grep -qi pdo_mysql || sudo apt-get install -y php-mysql
          for db in mysql:8.4 mariadb:10.11 mariadb:11.8; do
            echo "::group::$db"
            docker run -d --name testdb -e MYSQL_ROOT_PASSWORD=t -e MARIADB_ROOT_PASSWORD=t -p 127.0.0.1:13306:3306 docker.io/library/$db > /dev/null
            for _ in $(seq 1 60); do php -r 'new PDO("mysql:host=127.0.0.1;port=13306", "root", "t");' 2> /dev/null && break; sleep 2; done
            PP_MYSQL="127.0.0.1;13306;root;t;pptest" bash tests/payment_plans/run.sh "$PWD/addons/payment_plans" || fail=1
            docker rm -f testdb > /dev/null
            echo "::endgroup::"
          done
          exit ${fail:-0}
