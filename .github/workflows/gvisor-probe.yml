# A probe, not a test: gVisor under rootless Podman on a real machine (Actions > gVisor probe). The answers
# decide how Docker Hosting's "Extra isolation" is built (2026-11-15).
name: gVisor probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y podman passt uidmap > /dev/null
      - run: sudo bash .github/scripts/gvisor-probe.sh
