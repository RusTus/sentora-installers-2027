# Builds the files of the installers release and replaces those of the same names on the release
# tagged "current" (no new release or tag):
#   from this repository's master2027: sentora-installers-2027.zip, sentora2027-ub26.04 (the
#     installer), sentora-tls-check.sh
#   from sentora-core-2027's master2027 (bin/, their only copy): sentora-migrate-export (the old
#     server wgets it from here), sentora-smoke-test, sentora-web-probe
# Not touched: the PHP bundles and testssl_sh-3_2_5.zip (uploaded by hand; sentora-tls-check.sh
# checks the testssl zip against its SHA-256).
# Run it from Actions > Release > Run workflow.
#
# A file is uploaded only when its content differs from the one on the release. git archive stamps
# every file in a zip with the commit's date, so a zip from a newer commit has a new SHA-256 even
# when no file in it changed, and servers would see an update that is none. Zips are compared by
# their files (name, CRC-32, size, mode), other files byte for byte. "force" uploads anyway.
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Upload even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master2027
        uses: actions/checkout@v5
        with:
          ref: master2027
          fetch-depth: 0

      - name: Build the files
        run: |
          git archive --prefix=sentora-installers-2027/ -o sentora-installers-2027.zip master2027
          git show master2027:sentora2027-ub26.04 > sentora2027-ub26.04
          git show master2027:sentora-tls-check.sh > sentora-tls-check.sh
          for f in sentora-migrate-export sentora-smoke-test sentora-web-probe; do
            wget -nv -O "$f" "https://raw.githubusercontent.com/RusTus/sentora-core-2027/master2027/bin/$f"
            [ "$(head -c 2 "$f")" = '#!' ] || { echo "$f did not download"; exit 1; }
          done

      - name: Compare with the files on the current release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          cat > /tmp/same.py <<'EOF'
          import sys, zipfile
          def files(p):
              with zipfile.ZipFile(p) as z:
                  return sorted((i.filename, i.CRC, i.file_size, i.external_attr) for i in z.infolist())
          a, b = sys.argv[1], sys.argv[2]
          if a.endswith('.zip'):
              same = files(a) == files(b)
          else:
              same = open(a, 'rb').read() == open(b, 'rb').read()
          sys.exit(0 if same else 1)
          EOF
          mkdir -p old
          upload=""
          for f in sentora-installers-2027.zip sentora2027-ub26.04 sentora-tls-check.sh sentora-migrate-export sentora-smoke-test sentora-web-probe; do
            sha256sum "$f"
            if [ "$FORCE" = "true" ]; then
              echo "$f: upload (forced)"; upload="$upload $f"; continue
            fi
            if ! gh release download current --repo "$GITHUB_REPOSITORY" -p "$f" -D old --clobber 2> /dev/null; then
              echo "$f: not on the release yet, upload"; upload="$upload $f"; continue
            fi
            if python3 /tmp/same.py "old/$f" "$f" 2> /dev/null; then
              echo "$f: no change, the release keeps its file (and SHA-256)"
            else
              echo "$f: changed, upload"; upload="$upload $f"
            fi
          done
          echo "upload=${upload# }" >> "$GITHUB_OUTPUT"
          if [ -z "$upload" ]; then
            echo "::notice::Nothing changed since the files on the current release: nothing uploaded, servers see no update."
          fi

      - name: Replace the changed files on the current release
        if: steps.compare.outputs.upload != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # (--clobber deletes the old file first: when GitHub then fails, as with an HTTP 502, the file
        # is missing from current until the upload works, so it is tried a few times)
        run: |
          for try in 1 2 3 4 5; do
            gh release upload current ${{ steps.compare.outputs.upload }} --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "Upload failed (try $try), trying again in $(( try * 15 ))s"; sleep $(( try * 15 ))
          done
          echo "::error::The upload to current failed 5 times: run the workflow again (files it removed are missing from current until then)"
          exit 1

      - name: Release pages (current, and one release per version)
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.compare.outputs.upload }}
        run: |
          # The version is the core's VERSION file. "What's new" is every line added to CHANGELOG.md since
          # the previous version (since the commit that added its "- Release <previous>:" line), so the
          # change log stays one file, written as always. The current release gets the title
          # Sentora-<VERSION> and What's new above the README; a release per version (tag v<VERSION>) is
          # made once, with What's new, the whole CHANGELOG.md and a copy of every file of the current
          # release, so the Releases page lists the versions and their files.
          VERSION=$(wget -q -O - https://raw.githubusercontent.com/RusTus/sentora-core-2027/master2027/VERSION || true)
          VERSION=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._-')
          [ -n "$VERSION" ] || { echo "No VERSION: release pages left as they are."; exit 0; }
          PREV=$(grep -oE '^- Release [0-9][0-9.]*' CHANGELOG.md | awk '{print $3}' | sort -uV | awk -v v="$VERSION" '$0 != v' \
              | { cat; echo "$VERSION"; } | sort -V | awk -v v="$VERSION" '$0 == v {print p; exit} {p = $0}')
          BASE=""
          [ -n "$PREV" ] && BASE=$(git log --format=%H -S"- Release $PREV:" -- CHANGELOG.md | tail -1)
          if [ -n "$BASE" ]; then
              git diff -U0 "$BASE" HEAD -- CHANGELOG.md | grep -E '^\+[^+]' | sed 's/^+//' > whats-new.md || true
              echo "What's new in $VERSION: $(wc -l < whats-new.md) change log line(s) since $PREV (${BASE:0:8})"
          else
              grep -E "^- Release $VERSION[: ]" CHANGELOG.md > whats-new.md || true
              echo "No previous version found: What's new is the version's own line"
          fi
          python3 - "$VERSION" "$GITHUB_REPOSITORY" whats-new.md > release-notes.md <<'EOF'
          import re, sys
          version, repo, new = sys.argv[1], sys.argv[2], sys.argv[3]
          base = 'https://github.com/' + repo + '/blob/master2027/'
          def links(text):
              def fix(m):
                  bang, label, url = m.group(1), m.group(2), m.group(3)
                  if re.match(r'^([a-z][a-z0-9+.-]*:|#|/)', url, re.I):
                      return m.group(0)
                  full = base + (url[2:] if url.startswith('./') else url)
                  return bang + '[' + label + '](' + full + ('?raw=1' if bang else '') + ')'
              return re.sub(r'(!?)\[([^\]]*)\]\(([^)\s]+)\)', fix, text)
          whats = links(open(new, encoding='utf-8').read().strip())
          head = ['## What\'s new in Sentora-' + version, '', whats or '(no change log lines)', '',
                  'Every change, with the commands to apply service changes: [CHANGELOG.md](' + base + 'CHANGELOG.md)', '']
          open('version-notes.md', 'w', encoding='utf-8').write('\n'.join(head))
          readme = links(open('README.md', encoding='utf-8').read().replace('\r\n', '\n').rstrip())
          text = '\n'.join(head + ['---', '', readme]) + '\n'
          if len(text) > 120000:
              sys.exit('The release text is %d characters; GitHub allows 125000.' % len(text))
          sys.stdout.write(text)
          EOF
          gh release edit current --repo "$GITHUB_REPOSITORY" --title "Sentora-$VERSION" --notes-file release-notes.md
          echo "current: Sentora-$VERSION ($(wc -c < release-notes.md) characters)"

          # the version's own release: made once; later runs of the same version add the files they changed
          TAG="v$VERSION"
          mkdir -p version-files
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              if [ -n "$UPLOADED" ]; then
                  gh release upload "$TAG" $UPLOADED --clobber --repo "$GITHUB_REPOSITORY"
                  echo "$TAG: replaced $UPLOADED"
              else
                  echo "$TAG: already made, nothing new"
              fi
          else
              gh release download current --repo "$GITHUB_REPOSITORY" -D version-files
              cp CHANGELOG.md version-files/CHANGELOG.md
              gh release create "$TAG" version-files/* --repo "$GITHUB_REPOSITORY" --target master2027 \
                  --title "Sentora-$VERSION" --notes-file version-notes.md
              echo "$TAG: made, with $(ls version-files | wc -l) files"
          fi
