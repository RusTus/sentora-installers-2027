# Builds sentora-installers-2027.zip and the installer sentora2027-ub26.04
# from master2027 and replaces the files of the same names on the release
# tagged "current" (no new release or tag). The PHP bundles are not touched.
# Run it from Actions > Release > Run workflow.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master2027
        uses: actions/checkout@v5
        with:
          ref: master2027
          fetch-depth: 0

      - name: Build sentora-installers-2027.zip and sentora2027-ub26.04
        run: |
          git archive --prefix=sentora-installers-2027/ -o sentora-installers-2027.zip master2027
          git show master2027:sentora2027-ub26.04 > sentora2027-ub26.04

      - name: SHA-256
        run: sha256sum sentora-installers-2027.zip sentora2027-ub26.04

      - name: Replace the files on the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload current sentora-installers-2027.zip sentora2027-ub26.04 --clobber --repo "$GITHUB_REPOSITORY"
