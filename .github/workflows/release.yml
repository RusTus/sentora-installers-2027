# Builds the files of the installers release and replaces those of the same names on the release
# tagged "current" (no new release or tag):
#   from this repository's master2027: sentora-installers-2027.zip, sentora2027-ub26.04 (the
#     installer), sentora-tls-check.sh
#   from sentora-core-2027's master2027 (bin/, their only copy): sentora-migrate-export (the old
#     server wgets it from here), sentora-smoke-test, sentora-web-probe
# Not touched: the PHP bundles and testssl_sh-3_2_5.zip (uploaded by hand; sentora-tls-check.sh
# checks the testssl zip against its SHA-256).
# Run it from Actions > Release > Run workflow.
#
# A file is uploaded only when its content differs from the one on the release. git archive stamps
# every file in a zip with the commit's date, so a zip from a newer commit has a new SHA-256 even
# when no file in it changed, and servers would see an update that is none. Zips are compared by
# their files (name, CRC-32, size, mode), other files byte for byte. "force" uploads anyway.
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Upload even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master2027
        uses: actions/checkout@v5
        with:
          ref: master2027
          fetch-depth: 0

      - name: Build the files
        run: |
          git archive --prefix=sentora-installers-2027/ -o sentora-installers-2027.zip master2027
          git show master2027:sentora2027-ub26.04 > sentora2027-ub26.04
          git show master2027:sentora-tls-check.sh > sentora-tls-check.sh
          for f in sentora-migrate-export sentora-smoke-test sentora-web-probe; do
            wget -nv -O "$f" "https://raw.githubusercontent.com/RusTus/sentora-core-2027/master2027/bin/$f"
            [ "$(head -c 2 "$f")" = '#!' ] || { echo "$f did not download"; exit 1; }
          done

      - name: Compare with the files on the current release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          cat > /tmp/same.py <<'EOF'
          import sys, zipfile
          def files(p):
              with zipfile.ZipFile(p) as z:
                  return sorted((i.filename, i.CRC, i.file_size, i.external_attr) for i in z.infolist())
          a, b = sys.argv[1], sys.argv[2]
          if a.endswith('.zip'):
              same = files(a) == files(b)
          else:
              same = open(a, 'rb').read() == open(b, 'rb').read()
          sys.exit(0 if same else 1)
          EOF
          mkdir -p old
          upload=""
          for f in sentora-installers-2027.zip sentora2027-ub26.04 sentora-tls-check.sh sentora-migrate-export sentora-smoke-test sentora-web-probe; do
            sha256sum "$f"
            if [ "$FORCE" = "true" ]; then
              echo "$f: upload (forced)"; upload="$upload $f"; continue
            fi
            if ! gh release download current --repo "$GITHUB_REPOSITORY" -p "$f" -D old --clobber 2> /dev/null; then
              echo "$f: not on the release yet, upload"; upload="$upload $f"; continue
            fi
            if python3 /tmp/same.py "old/$f" "$f" 2> /dev/null; then
              echo "$f: no change, the release keeps its file (and SHA-256)"
            else
              echo "$f: changed, upload"; upload="$upload $f"
            fi
          done
          echo "upload=${upload# }" >> "$GITHUB_OUTPUT"
          if [ -z "$upload" ]; then
            echo "::notice::Nothing changed since the files on the current release: nothing uploaded, servers see no update."
          fi

      - name: Replace the changed files on the current release
        if: steps.compare.outputs.upload != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload current ${{ steps.compare.outputs.upload }} --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update the release page (title and text from the repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The title is Sentora-<VERSION> (the core's VERSION file); the text is what's new in this
          # version (its "- Release <version>:" line in CHANGELOG.md), then README.md, with
          # links to files in the repository made full GitHub links (relative ones do not work on a
          # release page). Written on every run, so an edited README shows after the next run.
          VERSION=$(wget -q -O - https://raw.githubusercontent.com/RusTus/sentora-core-2027/master2027/VERSION || true)
          VERSION=$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._-')
          python3 - "$VERSION" "$GITHUB_REPOSITORY" README.md > release-notes.md <<'EOF'
          import re, sys
          version, repo, files = sys.argv[1], sys.argv[2], sys.argv[3:]
          base = 'https://github.com/' + repo + '/blob/master2027/'
          def links(text, folder):
              def fix(m):
                  bang, label, url = m.group(1), m.group(2), m.group(3)
                  if re.match(r'^([a-z][a-z0-9+.-]*:|#|/)', url, re.I):
                      return m.group(0)
                  path = url[2:] if url.startswith('./') else url
                  full = base + folder + path
                  return bang + '[' + label + '](' + full + ('?raw=1' if bang else '') + ')'
              return re.sub(r'(!?)\[([^\]]*)\]\(([^)\s]+)\)', fix, text)
          new = ''
          for line in open('CHANGELOG.md', encoding='utf-8'):
              m = re.match(r'^- Release ' + re.escape(version) + r'(?: \([^)]*\))?:\s*(.*)', line)
              if m:
                  new = m.group(1).strip()
                  break
          out = ['## Sentora-' + version if version else '## Sentora-2027', '']
          if new:
              out += [links(new, ''), '']
          out += ['Every change, with the commands to apply service changes: [CHANGELOG.md](' + base + 'CHANGELOG.md)', '', '---', '']
          for i, f in enumerate(files):
              if i:
                  out += ['', '---', '']
              folder = f.rsplit('/', 1)[0] + '/' if '/' in f else ''
              out.append(links(open(f, encoding='utf-8').read().replace('\r\n', '\n').rstrip(), folder))
          text = '\n'.join(out) + '\n'
          if len(text) > 120000:
              sys.exit('The release text is %d characters; GitHub allows 125000.' % len(text))
          sys.stdout.write(text)
          EOF
          echo "Title: Sentora-$VERSION ($(wc -c < release-notes.md) characters of text)"
          gh release edit current --repo "$GITHUB_REPOSITORY" --title "Sentora-${VERSION:-2027}" --notes-file release-notes.md
