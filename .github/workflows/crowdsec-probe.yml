# A probe, not a test: where CrowdSec comes from on each supported system and what its package does by itself at
# install (Actions > CrowdSec probe). The answers decide how the Docker node installs it (2026-11-19).
name: CrowdSec probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: debian13, image: docker.io/library/debian:13}
          - {system: ubuntu26.04, image: docker.io/library/ubuntu:26.04}
          - {system: alma10, image: quay.io/almalinuxorg/almalinux:10}
          - {system: rocky10, image: quay.io/rockylinux/rockylinux:10}
          - {system: fedora45, image: quay.io/fedora/fedora:45}
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD/.github/scripts:/probe:ro" ${{ matrix.image }} bash /probe/crowdsec-probe.sh ${{ matrix.system }}
