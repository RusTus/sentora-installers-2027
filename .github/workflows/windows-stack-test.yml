# Temporary (deleted after the test): the owner's Windows stack installer on a fresh Windows Server 2025.
name: Windows stack test
on:
  push:
    branches: [claude/windows-stack-test]
jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free port 80
        shell: powershell
        run: Get-Service W3SVC -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
      - name: The first version (services ZPanelApache, ZPanelMySQL), with a database in it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File wintest\old.ps1 -RelaxedSqlMode
          if (-not (Get-Service ZPanelApache, ZPanelMySQL -ErrorAction SilentlyContinue)) { throw 'the old services are not there' }
          $env:MYSQL_PWD = (Get-Content C:\zpanel\configs\mysql\root-password.txt -Raw).Trim()
          $ErrorActionPreference = 'Continue'
          & C:\zpanel\bin\mysql\bin\mysql.exe -u root -e "CREATE DATABASE s3files; CREATE TABLE s3files.mabill01 (assm VARCHAR(20), comp VARCHAR(20), KEY (assm)) ENGINE=InnoDB; INSERT INTO s3files.mabill01 VALUES ('A1','C1'),('A1','C2');"
          if ($LASTEXITCODE -ne 0) { throw 'database setup failed' }
          # (MySQL 8.4 refuses a foreign key to a column that is not unique: the owner's error 6125)
          $out = & C:\zpanel\bin\mysql\bin\mysql.exe -u root -e "CREATE TABLE s3files.shortage (id INT, assm VARCHAR(20), CONSTRAINT assm FOREIGN KEY (assm) REFERENCES s3files.mabill01 (assm)) ENGINE=InnoDB" 2>&1 | ForEach-Object { "$_" }
          "without the option: $out"
          if (($out -join ' ') -notmatch '6125') { throw 'expected error 6125 before the option' }
          exit 0
      - name: The new version over it (-RelaxedSqlMode -LegacyForeignKeys)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File wintest\install-zpanel-stack.ps1 -RelaxedSqlMode -LegacyForeignKeys
      - name: Check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Service Apache2, MySQL | Format-Table Name, Status, StartType -AutoSize
          if ((Get-Service Apache2).Status -ne 'Running' -or (Get-Service MySQL).Status -ne 'Running') { throw 'new services not running' }
          if (Get-Service ZPanelApache, ZPanelMySQL -ErrorAction SilentlyContinue) { throw 'old services still there' }
          if (Get-NetFirewallRule -DisplayName 'ZPanel Apache (HTTP)' -ErrorAction SilentlyContinue) { throw 'old firewall rule still there' }
          Get-NetFirewallRule -DisplayName 'Apache HTTP Server (port 80)' | Format-Table DisplayName, Enabled -AutoSize
          (Get-Service Apache2).ServicesDependedOn | Format-Table Name -AutoSize
          $env:MYSQL_PWD = (Get-Content C:\zpanel\configs\mysql\root-password.txt -Raw).Trim()
          $ErrorActionPreference = 'Continue'
          $v = (& C:\zpanel\bin\mysql\bin\mysql.exe -u root -N -e "SELECT @@GLOBAL.restrict_fk_on_non_standard_key, @@GLOBAL.sql_mode, (SELECT COUNT(*) FROM s3files.mabill01)" 2>$null) -join ' '
          "restrict_fk, sql_mode, rows kept: $v"
          if ("$v" -notmatch '^0\s+NO_ENGINE_SUBSTITUTION\s+2$') { throw "settings or data: $v" }
          & C:\zpanel\bin\mysql\bin\mysql.exe -u root -e "CREATE TABLE s3files.shortage (id INT, assm VARCHAR(20), CONSTRAINT assm FOREIGN KEY (assm) REFERENCES s3files.mabill01 (assm)) ENGINE=InnoDB; INSERT INTO s3files.shortage VALUES (1,'A1');"
          if ($LASTEXITCODE -ne 0) { throw 'the foreign key to a column that is not unique was still refused' }
          'ok   the foreign key of error 6125 is accepted now'
          (Invoke-WebRequest http://127.0.0.1/ -UseBasicParsing).Content
          Select-String -Path C:\zpanel\configs\mysql\my.ini -Pattern 'restrict_fk|sql_mode'
      - name: Uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File wintest\install-zpanel-stack.ps1 -Uninstall
          if (Get-Service Apache2, MySQL, ZPanelApache, ZPanelMySQL -ErrorAction SilentlyContinue) { throw 'services still there' }
          if (-not (Test-Path C:\zpanel\data\mysql\mysql.ibd)) { throw 'data gone' }
          'ok   services removed, data kept'
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zpanel-logs
          path: |
            C:\zpanel\logs
            C:\zpanel\configs\mysql\my.ini
