# Builds the extra PHP versions (Sentora's own builds, beside the system's PHP) for one system:
#   ubuntu26.04 (Ubuntu 26.04), debian13 (Debian 13), alma10 (AlmaLinux 10 and Rocky Linux 10)
# in a container of that system, with the build scripts in preconf/php-build, and puts them on the
# release tagged "current" (replacing files of the same names): sentora-php-<major.minor>-<system>-amd64.tar.gz.
# The installers and sentora-php-install download them from there. A bundle runs only on the system
# it was built on.
#
# Run it from Actions > PHP bundles > Run workflow. Versions:
#   empty        the system's usual set: Ubuntu 8.2 8.3 8.4, Debian 8.2 8.3 8.5, AlmaLinux 8.2 8.4 8.5
#   8.4          the newest 8.4 release, asked from php.net
#   8.4.28       exactly that release
#   7.1, 7.4     the steps for old apps (7.4: Ubuntu only); 8.1 the same as any 8.x (no more releases)
# Each PHP source is checked against the SHA-256 php.net publishes for it (7.1 and 7.4 and their
# libraries against theirs: see their build scripts).
#
# It also builds Snuffleupagus (the PHP hardening extension; every bundle has its own copy, switched
# off) for the system's own PHP: sentora-snuffleupagus-<version>-php<major.minor>-<system>-amd64.so on
# the same release, an older one of that system and PHP replaced. The PHP Hardening add-on downloads it.
#
# After the builds it writes php-bundles.json on the release: for every bundle there, its system,
# major.minor, exact version, SHA-256 and the Snuffleupagus version inside it; and under
# "snuffleupagus", each system's own-PHP build with its SHA-256. Servers read it to see whether a newer build is ready
# (PHP Versions shows a notice with an Update button) and sentora-php-install checks a download
# against it when GitHub's API does not answer. "list only" rewrites it without building anything.
name: PHP bundles

on:
  workflow_dispatch:
    inputs:
      system:
        description: The system to build for
        type: choice
        options: [ubuntu26.04, debian13, alma10]
        default: ubuntu26.04
      versions:
        description: "PHP versions (empty: the system's usual set; 8.4 = the newest 8.4; or exact, such as 8.4.28; 7.1, 7.4)"
        type: string
        default: ""
      list_only:
        description: Only rewrite php-bundles.json (build nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: php-bundles
  cancel-in-progress: false

jobs:
  list:
    if: ${{ !inputs.list_only }}
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        env:
          SYSTEM: ${{ inputs.system }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, sys, urllib.request
          system = os.environ['SYSTEM']
          usual = {'ubuntu26.04': '8.2 8.3 8.4', 'debian13': '8.2 8.3 8.5', 'alma10': '8.2 8.4 8.5'}[system]
          asked = os.environ.get('VERSIONS', '').split() or usual.split()
          out = []
          for v in asked:
              if v in ('7.1', '7.4'):
                  if v == '7.4' and system != 'ubuntu26.04':
                      sys.exit('7.4 is built for Ubuntu 26.04 only')
                  out.append(v)
              elif re.fullmatch(r'8\.\d+\.\d+', v):
                  out.append(v)
              elif re.fullmatch(r'8\.\d+', v):
                  # the newest release of that branch, as php.net lists it
                  with urllib.request.urlopen('https://www.php.net/releases/index.php?json&max=1&version=' + v, timeout=30) as r:
                      d = json.load(r)
                  full = sorted((k for k in d if re.fullmatch(re.escape(v) + r'\.\d+', k)), key=lambda s: [int(x) for x in s.split('.')])
                  if not full:
                      sys.exit('php.net lists no release of ' + v)
                  out.append(full[-1])
              else:
                  sys.exit('Not a version: ' + v)
          print('versions=' + json.dumps(out))
          print('Building: ' + ' '.join(out), file=sys.stderr)
          EOF

  build:
    needs: list
    runs-on: ubuntu-latest
    container: ${{ inputs.system == 'alma10' && 'quay.io/almalinuxorg/almalinux:10' || (inputs.system == 'debian13' && 'debian:13' || 'ubuntu:26.04') }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.list.outputs.versions) }}
    steps:
      - name: Tools
        run: |
          if command -v apt-get > /dev/null; then
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -yqq install git ca-certificates wget > /dev/null
          else
            dnf -y -q install git ca-certificates wget tar gzip > /dev/null
          fi
      - name: Check out master2027
        uses: actions/checkout@v5
        with:
          ref: master2027
      - name: Build PHP ${{ matrix.version }}
        env:
          DEBIAN_FRONTEND: noninteractive
          V: ${{ matrix.version }}
        run: |
          mkdir -p out && cd out
          case "$V" in
            7.1) bash ../preconf/php-build/build-sentora-php71.sh ;;
            7.4) bash ../preconf/php-build/build-sentora-php74.sh ;;
            *)   bash ../preconf/php-build/build-sentora-php.sh "$V" ;;
          esac
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.version }}
          path: out/sentora-php-*-${{ inputs.system }}-amd64.tar.gz
          if-no-files-found: error

  snuffleupagus:
    if: ${{ !inputs.list_only }}
    runs-on: ubuntu-latest
    container: ${{ inputs.system == 'alma10' && 'quay.io/almalinuxorg/almalinux:10' || (inputs.system == 'debian13' && 'debian:13' || 'ubuntu:26.04') }}
    steps:
      - name: Tools
        run: |
          if command -v apt-get > /dev/null; then
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -yqq install git ca-certificates wget > /dev/null
          else
            dnf -y -q install git ca-certificates wget tar gzip > /dev/null
          fi
      - name: Check out master2027
        uses: actions/checkout@v5
        with:
          ref: master2027
      - name: Build Snuffleupagus for the system's own PHP
        run: |
          mkdir -p out && cd out
          bash ../preconf/php-build/build-snuffleupagus-system.sh
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: snuffleupagus-system
          path: out/sentora-snuffleupagus-*-${{ inputs.system }}-amd64.so
          if-no-files-found: error

  publish:
    needs: [list, build, snuffleupagus]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.list_only }}
        with:
          path: bundles
          merge-multiple: true
      - name: Replace them on the current release
        if: ${{ !inputs.list_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la bundles
          set -- bundles/sentora-php-*-${{ inputs.system }}-amd64.tar.gz
          [ -e "$1" ] || { echo "Nothing was built."; exit 1; }
          # Snuffleupagus for the system's own PHP: an older build of the same system and PHP goes
          for f in bundles/sentora-snuffleupagus-*-${{ inputs.system }}-amd64.so; do
            [ -e "$f" ] || continue
            set -- "$@" "$f"
            tail=$(basename "$f" | sed -E 's/^sentora-snuffleupagus-[0-9.]+-//')
            gh release view current --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
              | grep -E "^sentora-snuffleupagus-[0-9.]+-${tail//./\\.}$" | grep -vx "$(basename "$f")" \
              | while read -r old; do gh release delete-asset current "$old" -y --repo "$GITHUB_REPOSITORY" || true; done || true
          done
          sha256sum "$@"
          for try in 1 2 3 4 5; do
            gh release upload current "$@" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "Upload failed (try $try), trying again in $(( try * 15 ))s"; sleep $(( try * 15 ))
          done
          exit 1
      - name: Write php-bundles.json (every bundle on the release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all
          gh release download current --repo "$GITHUB_REPOSITORY" -p 'sentora-php-*-amd64.tar.gz' -D all --clobber
          gh release download current --repo "$GITHUB_REPOSITORY" -p 'sentora-snuffleupagus-*-amd64.so' -D all --clobber || true
          python3 - all > php-bundles.json <<'EOF'
          import hashlib, json, os, re, sys, tarfile, time
          d = sys.argv[1]
          out = {'updated': time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime()), 'bundles': {}, 'snuffleupagus': {}}
          for f in sorted(os.listdir(d)):
              s = re.fullmatch(r'sentora-snuffleupagus-(\d+\.\d+\.\d+)-php(\d+\.\d+)-(.+)-amd64\.so', f)
              if s:
                  spv, mm, system = s.group(1), s.group(2), s.group(3)
                  have = out['snuffleupagus'].setdefault(system, {}).get(mm)
                  if have is None or tuple(map(int, spv.split('.'))) > tuple(map(int, have['version'].split('.'))):
                      sha = hashlib.sha256(open(os.path.join(d, f), 'rb').read()).hexdigest()
                      out['snuffleupagus'][system][mm] = {'version': spv, 'file': f, 'sha256': sha}
                      print('%s system PHP %s: Snuffleupagus %s' % (system, mm, spv), file=sys.stderr)
                  continue
              m = re.fullmatch(r'sentora-php-(\d+\.\d+)-(.+)-amd64\.tar\.gz', f)
              if not m:
                  continue
              mm, system = m.group(1), m.group(2)
              p = os.path.join(d, f)
              sha = hashlib.sha256(open(p, 'rb').read()).hexdigest()
              version = ''
              spv = ''
              with tarfile.open(p) as t:
                  for name in ('opt/sentora-php/%s/BUILD-INFO' % mm, './opt/sentora-php/%s/BUILD-INFO' % mm):
                      try:
                          info = t.extractfile(name).read().decode('utf-8', 'replace')
                          v = re.search(r'PHP (\d+\.\d+\.\d+)', info.split('\n')[0])
                          version = v.group(1) if v else ''
                          v = re.search(r'Snuffleupagus (\d+\.\d+\.\d+)', info)
                          spv = v.group(1) if v else ''
                          break
                      except KeyError:
                          continue
              out['bundles'].setdefault(system, {})[mm] = {'version': version, 'file': f, 'sha256': sha, 'snuffleupagus': spv}
              print('%s %s: %s' % (system, mm, version or '(no BUILD-INFO)'), file=sys.stderr)
          json.dump(out, sys.stdout, indent=1, sort_keys=True)
          EOF
          cat php-bundles.json
          for try in 1 2 3 4 5; do
            gh release upload current php-bundles.json --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep $(( try * 15 ))
          done
          exit 1
