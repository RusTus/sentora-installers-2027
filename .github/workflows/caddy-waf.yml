# Caddy with the Coraza web firewall for the Docker nodes (Actions > Caddy with Coraza, 2026-11-16): built for
# x86-64 and ARM64, tried on the stock apps behind its rules (what they would block), and, when asked, published
# as a release of its own (never "latest": the panel's releases stay the repository's latest). The node
# installer pins the files' SHA-256 in git: a new build is taken only by changing the installer.
name: Caddy with Coraza
on:
  workflow_dispatch:
    inputs:
      caddy:
        description: "Caddy version (e.g. v2.11.2; empty: the newest)"
        required: false
      coraza:
        description: "coraza-caddy version (empty: the newest)"
        required: false
      publish:
        description: "Publish the build as a release"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - id: build
        run: bash .github/scripts/caddy-waf-build.sh
        env:
          CADDY_VERSION: ${{ inputs.caddy }}
          CORAZA_VERSION: ${{ inputs.coraza }}
      - uses: actions/upload-artifact@v4
        with:
          name: caddy-sentora
          path: dist
          retention-days: 14
  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: caddy-sentora
          path: dist
      - run: chmod +x dist/caddy-sentora-* && bash .github/scripts/caddy-waf-probe.sh
  publish:
    needs: [build, probe]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caddy-sentora
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" dist/caddy-sentora-amd64 dist/caddy-sentora-arm64 dist/SHA256SUMS dist/versions.txt --repo "$GITHUB_REPOSITORY" \
              --target master2027 --latest=false --title "Caddy with Coraza for the Docker nodes ($TAG)" \
              --notes "Caddy with the Coraza web firewall (OWASP CRS), built by the Caddy with Coraza workflow. The Docker node installer pins these files' SHA-256. $(tr '\n' ' ' < dist/versions.txt)"
