# Sentora backup node test: each supported system in a container with systemd is made a backup node
# (backup-node/sentora2027-backup-node) and used over real SSH and rsync as a panel would, including what it
# must refuse. The script: .github/scripts/backup-node-test.sh. Results kept 14 days.
name: Backup node test

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'sentora-core-2027 branch for the panel side (sentora-backup-common)'
        default: master2027
  push:
    branches: [master2027, docker-hosting]
    paths:
      - backup-node/**
      - .github/scripts/backup-node-test.sh
      - .github/workflows/backup-node-test.yml

permissions:
  contents: read

jobs:
  backup-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [alma10, rocky10, fedora45, debian13, ubuntu26.04]
    steps:
      - uses: actions/checkout@v5
      - name: The core (the panel's side)
        uses: actions/checkout@v5
        with:
          repository: RusTus/sentora-core-2027
          ref: ${{ inputs.core_ref || 'master2027' }}
          path: core
      - name: rsync on the runner
        run: command -v rsync || sudo apt-get install -y rsync
      - name: Backup node
        run: CORE=$PWD/core .github/scripts/backup-node-test.sh results ${{ matrix.system }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-node-test-${{ matrix.system }}
          path: results
          retention-days: 14
